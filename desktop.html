<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e5">
  <title>Jamie’s 2026 Calendar — Desktop</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f7f1e5; --ink:#25313a; --muted:#69717a; --line:#d9cfbd; --weekend:#f0eadf; --today:#f6d45c; --trip:rgba(255,214,90,.75); --injury:rgba(243,164,169,.72); --interesting:rgba(170,213,151,.72); --school:rgba(169,205,242,.72); }
    * { box-sizing:border-box; }
    body { margin:0; min-width:1000px; background:var(--paper); color:var(--ink); font-family:"Space Grotesk",system-ui,sans-serif; }
    header { height:62px; display:flex; align-items:center; justify-content:space-between; padding:10px 22px; border-bottom:1px solid var(--line); background:rgba(247,241,229,.94); }
    h1 { margin:0; font-size:1.15rem; letter-spacing:-.035em; } h1 span { color:var(--muted); font-size:.78rem; font-weight:500; margin-left:8px; letter-spacing:0; }
    .back { color:var(--ink); text-decoration:none; border:1px solid var(--line); background:#fffaf0; padding:8px 11px; border-radius:8px; font-size:.78rem; font-weight:700; }
    .back:hover { background:#fff; }
    main { padding:10px 18px 14px; }
    .month { display:grid; grid-template-columns:95px minmax(0,1fr); height:calc((100vh - 87px) / 12); min-height:62px; max-height:94px; margin-bottom:3px; }
    .month-label { padding:7px 8px 4px 0; font-weight:800; font-size:.88rem; letter-spacing:-.035em; display:flex; align-items:flex-start; }
    .month-grid { display:grid; grid-template-columns:repeat(42,minmax(0,1fr)); grid-template-rows:1fr; min-width:0; }
    .day { min-width:0; min-height:0; position:relative; padding:1px 0; overflow:visible; background:transparent; }
    .day:not(.empty)::before { content:""; position:absolute; inset:1px; z-index:0; border:1px solid rgba(217,207,189,.82); border-radius:8px; background:rgba(255,255,255,.38); }
    .day.weekend::before { background:rgba(240,234,223,.82); }
    .day.today::before { box-shadow:inset 0 0 0 2px var(--today); background:rgba(246,212,92,.20); }
    .day.empty { background:transparent; }
    .date { position:absolute; z-index:2; top:3px; left:4px; font-size:.56rem; color:var(--muted); font-weight:800; line-height:1; }
    .events { position:relative; z-index:1; padding:12px 2px 0; display:grid; gap:1px; }
    .event { height:8px; width:calc(100% + 1px); margin-left:-1px; min-width:0; border-radius:0; padding:0 2px; font-family:"Patrick Hand",cursive; font-size:.53rem; font-weight:bold; line-height:8px; white-space:nowrap; overflow:visible; background:var(--trip); }
    .event.start { position:relative; z-index:4; display:block; min-height:10px; height:auto; border-radius:3px 0 0 3px; margin-left:0; width:calc(100% * var(--span, 1)); padding:1px 2px 2px; line-height:1.1; white-space:normal; overflow-wrap:normal; word-break:normal; hyphens:none; }
    .event.end { border-radius:0 3px 3px 0; }
    .event.start.end { border-radius:3px; }
    .event.single { width:100% !important; white-space:normal; overflow:hidden; overflow-wrap:normal; word-break:normal; hyphens:none; max-height:36px; }
    .event.injury { background:var(--injury); } .event.interesting { background:var(--interesting); } .event.school { background:var(--school); } .event.cancelled { opacity:.55; text-decoration:line-through; }
    .event.continuation { font-size:0; opacity:0; pointer-events:none; }
    #status { font-size:.8rem; color:var(--muted); padding:28px; }
    @media (max-height:760px) { .month { min-height:54px; } .event { height:7px; line-height:7px; } }
    @media print { body { min-width:0; } header { height:42px; padding:5px 12px; } .back { display:none; } main { padding:4px 10px; } .month { height:calc((100vh - 70px) / 12); max-height:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Jamie’s 2026 Calendar <span>desktop year view</span></h1>
    <a class="back" href="./">Open main app ↗</a>
  </header>
  <main>
    <div id="year"><div id="status">Loading calendar…</div></div>
  </main>
  <script>
    const YEAR = 2026;
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const today = new Date();
    const isoDate = (year, month, day) => `${year}-${String(month + 1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const mondayOffset = date => (date.getDay() + 6) % 7;

    function literalFromMain(source, name) {
      const marker = `const ${name} =`;
      const start = source.indexOf(marker);
      if (start < 0) throw new Error(`Could not find ${name} in the main app.`);
      let i = source.indexOf("=", start) + 1;
      while (/\s/.test(source[i])) i++;
      const open = source[i], close = open === "[" ? "]" : "}";
      if (open !== "[" && open !== "{") throw new Error(`Unexpected ${name} format.`);
      let depth = 0, quote = "", escaped = false;
      for (let end = i; end < source.length; end++) {
        const ch = source[end];
        if (quote) { if (escaped) escaped = false; else if (ch === "\\") escaped = true; else if (ch === quote) quote = ""; continue; }
        if (ch === "'" || ch === '"' || ch === "`") { quote = ch; continue; }
        if (ch === open) depth++;
        if (ch === close && --depth === 0) return Function(`"use strict"; return (${source.slice(i, end + 1)});`)();
      }
      throw new Error(`Could not parse ${name}.`);
    }

    async function loadCalendarData() {
      const main = await fetch("index.html", { cache:"no-store" }).then(response => {
        if (!response.ok) throw new Error("Could not load the main calendar.");
        return response.text();
      });
      return { events: literalFromMain(main, "events") };
    }

    function isRaceEvent(event) {
      if (event.race === false) return false;
      const text = `${event.title || ""} ${event.listTitle || ""}`;
      return Boolean(event.race || /\b(utmb|maverick|jurassic|copper|st sunday|race|skyrace|skytrail|trail run)\b/i.test(text));
    }

    function render(data) {
      const { events } = data;
      const host = document.getElementById("year");
      const todayIso = isoDate(today.getFullYear(), today.getMonth(), today.getDate());
      const eventsForDate = iso => events.filter(event => iso >= event.start && iso <= (event.end || event.start));
      host.innerHTML = "";
      for (let month = 0; month < 12; month++) {
        const first = new Date(YEAR, month, 1);
        const daysInMonth = new Date(YEAR, month + 1, 0).getDate();
        const section = document.createElement("section");
        section.className = "month";
        section.innerHTML = `<div class="month-label">${MONTHS[month]}</div><div class="month-grid"></div>`;
        const grid = section.querySelector(".month-grid");
        for (let slot = 0; slot < 42; slot++) {
          const day = slot - mondayOffset(first) + 1;
          const cell = document.createElement("div");
          if (day < 1 || day > daysInMonth) { cell.className = "day empty"; grid.append(cell); continue; }
          const date = new Date(YEAR, month, day);
          const iso = isoDate(YEAR, month, day);
          const dayEvents = eventsForDate(iso);
          const tooltip = [iso, ...dayEvents.map(e => `${e.listTitle || e.title}${e.meta ? ` — ${e.meta}` : ""}`)].filter(Boolean).join("\n");
          cell.className = `day${slot % 7 === 0 ? " week-start" : ""}${date.getDay() === 0 || date.getDay() === 6 ? " weekend" : ""}${iso === todayIso ? " today" : ""}`;
          cell.title = tooltip;
          const eventHtml = dayEvents.map(event => {
            const eventEnd = event.end || event.start;
            const single = eventEnd === event.start;
            const start = iso === event.start || day === 1;
            const end = iso === eventEnd || day === daysInMonth;
            const endsThisMonth = eventEnd.slice(0, 7) === iso.slice(0, 7);
            const span = start ? (endsThisMonth ? Number(eventEnd.slice(-2)) : daysInMonth) - day + 1 : 1;
            const style = start ? ` style="--span:${span}"` : "";
            const label = isRaceEvent(event) ? `🏁 ${event.title || ""}` : (event.title || "");
            return `<div class="event ${event.status || "trip"}${single ? " single" : ""}${start ? " start" : " continuation"}${end ? " end" : ""}"${style} title="${(event.listTitle || event.title).replace(/"/g,"&quot;")}">${start ? label : ""}</div>`;
          }).join("");
          cell.innerHTML = `<span class="date">${day}</span><div class="events">${eventHtml}</div>`;
          grid.append(cell);
        }
        host.append(section);
      }
    }

    loadCalendarData().then(render).catch(error => {
      document.getElementById("year").innerHTML = `<div id="status">${error.message} Try reloading the main app first.</div>`;
      console.error(error);
    });
  </script>
</body>
</html>
