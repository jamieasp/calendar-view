<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jamie Runs</title>
  <meta name="theme-color" content="#ffe24d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Jamie Runs" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f2ea;
      --paper: #fffdf8;
      --ink: #17202a;
      --muted: #7b7468;
      --line: #ded6c8;
      --weekend: rgba(120, 120, 120, 0.08);
      --today: #f9d65c;
      --pencil: #16120d;
      --highlighter: rgba(255, 226, 77, 0.62);
      --highlighter-strong: rgba(255, 216, 38, 0.78);
      --pink-highlighter: rgba(255, 147, 190, 0.58);
      --interesting-highlighter: rgba(106, 229, 214, 0.62);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: var(--ink);
    }
    main { width: min(100%, 430px); margin: 0 auto; padding: 24px 12px 34px; background: #fff; }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -24px -12px 28px;
      padding: 18px 12px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.54), rgba(255,255,255,0.28));
      backdrop-filter: blur(28px) saturate(1.75);
      -webkit-backdrop-filter: blur(28px) saturate(1.75);
      border-bottom: 1px solid rgba(255,255,255,0.38);
      box-shadow: 0 14px 36px rgba(50, 40, 25, 0.06), inset 0 -1px 0 rgba(222, 214, 200, 0.24);
    }
    h1 { margin: 0; font-size: clamp(1.7rem, 8vw, 2.6rem); line-height: 0.9; letter-spacing: -0.07em; }
    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }
    .header-button {
      appearance: none;
      border: 1px solid #d9d0c2;
      border-radius: 999px;
      background: rgba(255,255,255,0.34);
      backdrop-filter: blur(18px) saturate(1.55);
      -webkit-backdrop-filter: blur(18px) saturate(1.55);
      color: var(--ink);
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      font: inherit;
      font-size: 1.16rem;
      font-weight: 850;
      letter-spacing: -0.02em;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(50, 40, 25, 0.05);
    }
    .material-symbols-outlined {
      font-family: "Material Symbols Outlined";
      font-weight: normal;
      font-style: normal;
      font-size: 1.34rem;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "liga";
    }
    .header-button:hover { background: rgba(255, 247, 220, 0.62); }
    .header-button:active { transform: translateY(1px); }
    .sub { color: var(--muted); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.82rem; }
    .year-grid {
      position: relative;
      display: grid;
      grid-template-columns: 30px repeat(7, minmax(0, 1fr));
      gap: 3px;
      align-items: stretch;
    }
    .month-label {
      position: absolute;
      left: 0;
      width: 30px;
      scroll-margin-top: 112px;
      border-radius: 0;
      background: linear-gradient(180deg, rgba(255, 226, 77, 0.32), rgba(255, 226, 77, 0.08));
      overflow: visible;
    }
    .month-label-text {
      position: absolute;
      left: 50%;
      top: 50%;
      display: block;
      width: max-content;
      max-width: none;
      transform: translate(-50%, -50%) rotate(-90deg);
      transform-origin: center;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1;
      letter-spacing: -0.045em;
      text-transform: uppercase;
      font-weight: 900;
      white-space: nowrap;
    }
    .month-total {
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 1.04rem;
      font-weight: 800;
      text-transform: none;
      letter-spacing: -0.02em;
    }
    .month-total .unit { color: var(--muted); margin-left: 1px; }
    .dow { color: var(--muted); font-size: 0.68rem; font-weight: 900; text-align: center; text-transform: uppercase; padding-bottom: 3px; align-self: end; }
    .day {
      min-height: 76px;
      border-radius: 9px;
      border: 1px solid #eadfce;
      padding: 4px 0;
      position: relative;
      background: rgba(255,255,255,0.55);
      overflow: visible;
    }
    .weekend { background: var(--weekend); }
    .past {
      background: rgba(246, 242, 234, 0.38);
      border-color: rgba(234, 223, 206, 0.55);
    }
    .past.weekend { background: rgba(232, 230, 226, 0.42); }
    .past .date-number { color: color-mix(in srgb, var(--muted) 45%, white); }
    .today {
      background: rgba(249, 214, 92, 0.18);
      outline: 2px solid var(--today);
      outline-offset: -2px;
    }
    .empty { opacity: 0; pointer-events: none; }
    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      min-height: 1rem;
      margin: 0 4px 4px;
    }
    .date-number {
      display: block;
      color: color-mix(in srgb, var(--muted) 72%, white);
      font-size: 0.76rem;
      font-weight: 850;
      line-height: 1;
      margin: 0;
    }
    .stretch-streak {
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 0.84rem;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      transform: rotate(-2deg);
    }
    .abs-streak {
      position: absolute;
      right: 4px;
      bottom: 3px;
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 0.86rem;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      transform: rotate(2deg);
    }
    .event-stack { display: grid; gap: 2px; position: relative; }
    .event-bar, .event-spacer {
      min-height: 17px;
      border-radius: 4px;
      font-size: 1.05rem;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: -0.02em;
    }
    .event-spacer { visibility: hidden; }
    .event-bar {
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-weight: 800;
      padding: 3px 2px;
      position: relative;
      z-index: 3;
      background: linear-gradient(100deg, transparent 0, var(--highlighter-strong) 2% 98%, transparent 100%);
      box-shadow: none;
      transform: rotate(-0.25deg);
    }
    .event-bar.single {
      display: block;
      white-space: normal;
      overflow-wrap: normal;
      min-height: 0;
      padding: 0 2px;
      border-radius: 0;
      line-height: 1.22;
      background: none;
    }
    .event-bar.single .highlight-text {
      background: linear-gradient(transparent 44%, var(--highlighter-strong) 44% 82%, transparent 82%);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      padding: 0 0.05em;
    }
    .event-bar.multi {
      white-space: nowrap;
      overflow: hidden;
      min-height: 0;
      padding: 0 2px;
      line-height: 1.22;
      border-radius: 0;
    }
    .event-bar.multi.upcoming,
    .event-bar.multi.completed,
    .event-bar.multi.trip { background: linear-gradient(transparent 44%, var(--highlighter) 44% 82%, transparent 82%); }
    .event-bar.multi.injury { background: linear-gradient(transparent 44%, var(--pink-highlighter) 44% 82%, transparent 82%); }
    .event-bar.multi.interesting { background: linear-gradient(transparent 44%, var(--interesting-highlighter) 44% 82%, transparent 82%); }
    .event-bar.single.upcoming,
    .event-bar.single.completed,
    .event-bar.single.trip,
    .event-bar.single.injury,
    .event-bar.single.interesting { background: none; }
    .event-bar.single.injury .highlight-text { background: linear-gradient(transparent 44%, var(--pink-highlighter) 44% 82%, transparent 82%); }
    .event-bar.single.interesting .highlight-text { background: linear-gradient(transparent 44%, var(--interesting-highlighter) 44% 82%, transparent 82%); }
    .event-bar.cancelled {
      text-decoration: line-through;
      opacity: 0.74;
    }
    .event-bar.multi.cancelled { background: linear-gradient(transparent 44%, rgba(220, 220, 120, 0.55) 44% 82%, transparent 82%); }
    .event-bar.single.cancelled { background: none; }
    .event-bar.single.cancelled .highlight-text { background: linear-gradient(transparent 44%, rgba(220, 220, 120, 0.55) 44% 82%, transparent 82%); }
    .event-bar.continuation { opacity: 0.82; }
    .event-bar.end { border-top-right-radius: 7px; border-bottom-right-radius: 8px; }
    .event-bar.start { border-top-left-radius: 8px; border-bottom-left-radius: 6px; }
    .run-distance {
      display: block;
      width: fit-content;
      margin: 3px 2px 0;
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 1.11rem;
      font-weight: 800;
      line-height: 1.16;
      white-space: nowrap;
      background: none;
      padding: 0 0.08em;
      transform: rotate(0.2deg);
    }
    .run-distance .unit {
      color: var(--muted);
      margin-left: 1px;
    }

    .races-section {
      margin-top: 56px;
      padding-top: 8px;
    }
    .races-section h2 {
      margin: 0 0 14px;
      font-size: clamp(1.65rem, 3vw, 2.8rem);
      letter-spacing: -0.055em;
      line-height: 0.95;
    }
    .race-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .race-card {
      border: 1px solid #eadfce;
      border-radius: 14px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.62);
    }
    .race-name {
      display: block;
      font-weight: 900;
      letter-spacing: -0.035em;
      font-size: 1.18rem;
      line-height: 1.05;
    }
    .race-countdown {
      display: block;
      margin-top: 6px;
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1;
    }
    .race-meta {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-weight: 750;
      font-size: 0.88rem;
    }

    .chart-section {
      margin-top: 64px;
      padding-top: 12px;
    }
    .chart-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }
    .chart-header h2 {
      margin: 0;
      font-size: clamp(1.65rem, 3vw, 2.8rem);
      letter-spacing: -0.055em;
      line-height: 0.95;
    }
    .distance-chart {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .chart-axis,
    .chart-grid {
      stroke: #ded6c8;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    .chart-grid { opacity: 0.68; }
    .chart-line {
      fill: none;
      stroke: #17202a;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .chart-line.comparison-2025 {
      stroke: #8f887e;
      stroke-width: 3;
      opacity: 0.86;
    }
    .chart-line.comparison-2024 {
      stroke: #c4beb5;
      stroke-width: 3;
      opacity: 0.9;
    }
    .chart-dot { fill: var(--pencil); }
    .chart-label {
      fill: var(--muted);
      font-size: 24px;
      font-weight: 850;
    }
    .chart-end-label {
      fill: var(--ink);
      font-size: 25px;
      font-weight: 900;
    }
    .chart-note {
      fill: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 38px;
      font-weight: 800;
    }
    .chart-itbs {
      fill: var(--pink-highlighter);
      opacity: 0.38;
    }
    .health-charts {
      margin-top: 72px;
      padding-top: 12px;
    }
    .health-charts h2 {
      margin: 0 0 18px;
      font-size: clamp(1.65rem, 3vw, 2.8rem);
      letter-spacing: -0.055em;
      line-height: 0.95;
    }
    .health-panel {
      margin-top: 28px;
    }
    .health-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .health-daily-dot { fill: #6f8fad; opacity: 0.38; }
    .health-latest-dot { fill: #152536; stroke: white; stroke-width: 2.2; opacity: 0.98; }
    .health-ma3 { fill: none; stroke: #d46a00; stroke-width: 3.5; opacity: 0.95; stroke-linejoin: round; stroke-linecap: round; }
    .health-ma7 { fill: none; stroke: #0b65c2; stroke-width: 4.8; stroke-linejoin: round; stroke-linecap: round; }
    .health-latest-line { stroke: #152536; stroke-width: 2.9; stroke-dasharray: 3 6; opacity: 0.55; }
    .health-jan-band { fill: #4caf50; opacity: 0.10; }
    .health-event-line { stroke-width: 3; stroke-dasharray: 2 6; opacity: 0.9; }
    .health-run-icon { stroke: #111; fill: none; stroke-width: 2.1; stroke-linecap: round; opacity: 0.9; }
    .health-run-head { fill: #111; opacity: 0.9; }
    .health-rug { stroke: #6f8fad; stroke-width: 2; opacity: 0.50; stroke-linecap: round; }
    .health-rug-latest { stroke: #152536; stroke-width: 4.2; opacity: 0.94; stroke-linecap: round; }
    .health-title { fill: var(--ink); font-size: 38px; font-weight: 900; }
    .health-axis-label { fill: var(--muted); font-size: 24px; font-weight: 850; }
    .health-event-label { font-size: 24px; font-weight: 850; }
    .health-percentile { fill: #152536; font-size: 25px; font-weight: 900; }
    .health-percentile-bg { fill: white; opacity: 0.78; }
    .health-grid { stroke: #9aa7b1; stroke-width: 1; opacity: 0.16; }
    .health-y-grid { stroke: #9aa7b1; stroke-width: 1; opacity: 0.25; }
    .health-axis { stroke: #ded6c8; stroke-width: 1.3; }


    @media (max-width: 760px) {
      main { width: 100vw; max-width: none; }
      .header-button { width: 38px; height: 38px; font-size: 1.05rem; }
      .day { min-height: 66px; }
      .event-bar { font-size: 1.03rem; }
    }
    @media print {
      body { background: white; }
      main { max-width: none; padding: 0; }
      header { position: static; margin: 0 0 8px; padding: 0; border: 0; background: transparent; }
      .header-actions { display: none; }
      .year-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .month { box-shadow: none; border-radius: 8px; padding: 8px; }
      .day { min-height: 52px; padding: 3px; }
      .event-bar { font-size: 0.95rem; min-height: 20px; }
    }
  </style>
</head>

    function isRaceEvent(event) {
      const text = `${event.title} ${event.listTitle || ""}`;
      return Boolean(event.race || /\b(utmb|maverick|jurassic|copper|st sunday|race|skyrace|skytrail|trail run)\b/i.test(text));
    }
    function raceDisplayTitle(event) {
      const title = event.title.replace(/^🏁\s*/, "");
      return isRaceEvent(event) ? `🏁 ${title}` : title;
    }

    function mondayFirstOffset(date) {
      return (date.getDay() + 6) % 7;
    }
    function isoDate(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
    function dateLabel(iso) {
      return new Date(`${iso}T12:00:00`).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    }
    function eventsForDate(iso) {
      return events.filter(event => iso >= event.start && iso <= (event.end || event.start));
    }
    function isStartOfVisibleSegment(event, date) {
      const iso = isoDate(date.getFullYear(), date.getMonth(), date.getDate());
      return iso === event.start || date.getDay() === 1;
    }
    function daysBetween(startIso, endIso) {
      const start = new Date(`${startIso}T12:00:00`);
      const end = new Date(`${endIso}T12:00:00`);
      return Math.round((end - start) / 86400000) + 1;
    }
    function visibleSegmentSpan(event, date) {
      const iso = isoDate(date.getFullYear(), date.getMonth(), date.getDate());
      const end = event.end || event.start;
      const daysLeftInWeek = 7 - ((date.getDay() + 6) % 7);
      const daysLeftInEvent = daysBetween(iso, end);
      return Math.max(1, Math.min(daysLeftInWeek, daysLeftInEvent));
    }
    function monthRunTotal(month) {
      const prefix = `${year}-${String(month + 1).padStart(2, "0")}-`;
      return Object.entries(runDistances)
        .filter(([iso]) => iso.startsWith(prefix))
        .reduce((sum, [, km]) => sum + Number(km || 0), 0);
    }
    function renderUpcomingRaces() {

      if (!list) return;
      const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const upcoming = events

        .map(event => ({ ...event, date: new Date(`${event.start}T12:00:00`) }))
        .filter(event => event.date >= todayStart)
        .sort((a, b) => a.date - b.date);
      list.innerHTML = upcoming.map(event => {
        const daysLeft = Math.ceil((event.date - todayStart) / 86400000);
        const dayLabel = daysLeft === 0 ? "today" : `${daysLeft} day${daysLeft === 1 ? "" : "s"}`;
        return `<li class="race-card"><span class="race-name">${raceDisplayTitle(event)}</span><span class="race-countdown">${dayLabel}</span><span class="race-meta">${dateLabel(event.start)}${event.meta ? ` · ${event.meta}` : ""}</span></li>`;
      }).join("");
    }

    function cumulativeSeries(distances, seriesYear) {
      const seriesStart = new Date(`${seriesYear}-01-01T12:00:00`);
      const points = [{ iso: `${seriesYear}-01-01`, date: seriesStart, km: 0, cumulative: 0 }];
      let cumulative = 0;
      const entries = Object.entries(distances)
        .sort(([a], [b]) => a.localeCompare(b))
        .map(([iso, km]) => ({ iso, date: new Date(`${iso}T12:00:00`), km }));
      for (const entry of entries) {
        cumulative += Number(entry.km || 0);
        points.push({ ...entry, cumulative });
      }
      return { points, total: Math.round(cumulative) };
    }
    function centeredMA(values, windowSize) {
      const left = Math.floor((windowSize - 1) / 2);
      const right = Math.floor(windowSize / 2);
      return values.map((_, index) => {
        const lo = Math.max(0, index - left);
        const hi = Math.min(values.length, index + right + 1);
        return values.slice(lo, hi).reduce((sum, value) => sum + value, 0) / (hi - lo);
      });
    }
    function dateFromIso(iso) {
      return new Date(`${iso}T12:00:00`);
    }
    function svgPath(points, x, y) {
      return points.map((point, index) => `${index ? "L" : "M"}${x(point.date).toFixed(1)},${y(point.value).toFixed(1)}`).join(" ");
    }
    function mondayDates(startDate, endDate) {
      const dates = [];
      const cur = new Date(startDate);
      cur.setDate(cur.getDate() + ((8 - cur.getDay()) % 7));
      while (cur <= endDate) {
        dates.push(new Date(cur));
        cur.setDate(cur.getDate() + 7);
      }
      return dates;
    }
    function healthRunIcon(x, y) {
      return `<g class="health-run-icon" transform="translate(${(x - 7).toFixed(1)} ${(y - 14).toFixed(1)})">
        <circle class="health-run-head" cx="7" cy="3" r="2.1"></circle>
        <path d="M7 5.5 L6 8.4 M6 7.2 L3.3 6.2 M6 7.2 L9.4 6.6 M6 8.4 L3.8 12.2 M6 8.4 L9.8 12.0"></path>
      </g>`;
    }
    function renderHealthPanel(panel, data) {
      const width = 1500;
      const height = 620;
      const margin = { top: 88, right: 118, bottom: 74, left: 112 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const points = panel.points.map(point => ({ date: dateFromIso(point.date), iso: point.date, value: Number(point.value) }));
      if (!points.length) return "";
      const values = points.map(point => point.value);
      const ymin = Math.min(...values);
      const ymax = Math.max(...values);
      const yr = ymax - ymin || 1;
      const yDomainMin = ymin - yr * 0.18;
      const yDomainMax = ymax + yr * 0.18;
      const start = points[0].date;
      const end = points[points.length - 1].date;
      const spanDays = Math.max(1, Math.round((end - start) / 86400000));
      const x = date => margin.left + ((date - start) / 86400000 / spanDays) * plotW;
      const y = value => margin.top + plotH - ((value - yDomainMin) / (yDomainMax - yDomainMin)) * plotH;
      const ma3 = centeredMA(values, 3).map((value, index) => ({ date: points[index].date, value }));
      const ma7 = centeredMA(values, 7).map((value, index) => ({ date: points[index].date, value }));
      const yTicks = Array.from({ length: 5 }, (_, index) => yDomainMin + ((yDomainMax - yDomainMin) * index / 4));
      const monthTicks = [];
      const monthCursor = new Date(start.getFullYear(), start.getMonth(), 1, 12);
      while (monthCursor <= end) {
        if (monthCursor >= start) monthTicks.push(new Date(monthCursor));
        monthCursor.setMonth(monthCursor.getMonth() + 1);
      }
      const janValues = points.filter(point => point.date.getFullYear() === 2026 && point.date.getMonth() === 0).map(point => point.value);
      let janBand = "";
      if (janValues.length >= 2) {
        const avg = janValues.reduce((sum, value) => sum + value, 0) / janValues.length;
        const sd = Math.sqrt(janValues.reduce((sum, value) => sum + (value - avg) ** 2, 0) / (janValues.length - 1));
        janBand = `<rect class="health-jan-band" x="${margin.left}" y="${y(avg + sd).toFixed(1)}" width="${plotW}" height="${Math.max(0, y(avg - sd) - y(avg + sd)).toFixed(1)}"></rect>`;
      }
      const latest = points[points.length - 1];
      const iconY = y(ymin - yr * 0.055);
      const longRuns = data.longRunDates
        .map(dateFromIso)
        .filter(date => date >= start && date <= end)
        .map(date => healthRunIcon(x(date), iconY))
        .join("");
      const events = data.eventMarkers
        .filter(marker => dateFromIso(marker.date) >= start && dateFromIso(marker.date) <= end)
        .map(marker => {
          const markerDate = dateFromIso(marker.date);
          return `<line class="health-event-line" x1="${x(markerDate).toFixed(1)}" y1="${margin.top}" x2="${x(markerDate).toFixed(1)}" y2="${height - margin.bottom}" stroke="${marker.color}"></line>
            <text class="health-event-label" x="${(x(markerDate) + 6).toFixed(1)}" y="${(ymax + marker.yoff * yr * 0.08, margin.top + (1 - marker.yoff) * 70).toFixed(1)}" fill="${marker.color}">${marker.label}</text>`;
        }).join("");
      const rug = panel.kind === "RHR" ? "" : values.map((value, index) => {
        const jitter = Math.max(yr * 0.018, 0.28) * Math.sin(index * 12.9898) * 0.85;
        const yy = y(value + jitter);
        return `<line class="health-rug" x1="${(width - margin.right + 22).toFixed(1)}" y1="${yy.toFixed(1)}" x2="${(width - margin.right + 50).toFixed(1)}" y2="${yy.toFixed(1)}"></line>`;
      }).join("") + (panel.kind === "RHR" ? "" : `<line class="health-rug-latest" x1="${(width - margin.right + 10).toFixed(1)}" y1="${y(latest.value).toFixed(1)}" x2="${(width - margin.right + 50).toFixed(1)}" y2="${y(latest.value).toFixed(1)}"></line>`);
      const pct = panel.latestPercentile == null ? "" : `P${Math.round(panel.latestPercentile)}`;
      const latestText = `${latest.value.toFixed(panel.kind === "RHR" ? 0 : 1)}${panel.unit ? ` ${panel.unit}` : ""}`;
      return `<article class="health-panel"><svg class="health-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${panel.title}">
        ${janBand}
        ${mondayDates(start, end).map(date => `<line class="health-grid" x1="${x(date).toFixed(1)}" y1="${margin.top}" x2="${x(date).toFixed(1)}" y2="${height - margin.bottom}"></line>`).join("")}
        ${yTicks.map(tick => `<line class="health-y-grid" x1="${margin.left}" y1="${y(tick).toFixed(1)}" x2="${width - margin.right}" y2="${y(tick).toFixed(1)}"></line><text class="health-axis-label" x="${margin.left - 14}" y="${(y(tick) + 6).toFixed(1)}" text-anchor="end">${tick.toFixed(panel.kind === "RHR" ? 0 : 1)}</text>`).join("")}
        ${monthTicks.map(date => `<text class="health-axis-label" x="${x(date).toFixed(1)}" y="${height - 21}" text-anchor="middle">${date.toLocaleDateString("en-GB", { month: "short" })}</text>`).join("")}
        <line class="health-axis" x1="${margin.left}" y1="${height - margin.bottom}" x2="${width - margin.right}" y2="${height - margin.bottom}"></line>
        <line class="health-axis" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${height - margin.bottom}"></line>
        <text class="health-title" x="${margin.left}" y="46">${panel.title}</text>
        <text class="health-axis-label" x="22" y="${margin.top + plotH / 2}" text-anchor="middle" transform="rotate(-90 22 ${margin.top + plotH / 2})">${panel.ylabel}</text>
        <path class="health-ma3" d="${svgPath(ma3, x, y)}"></path>
        <path class="health-ma7" d="${svgPath(ma7, x, y)}"></path>
        <line class="health-latest-line" x1="${margin.left}" y1="${y(latest.value).toFixed(1)}" x2="${width - margin.right}" y2="${y(latest.value).toFixed(1)}"></line>
        ${points.map(point => `<circle class="health-daily-dot" cx="${x(point.date).toFixed(1)}" cy="${y(point.value).toFixed(1)}" r="4.6"></circle>`).join("")}
        ${events}
        ${longRuns}
        ${rug}
        <circle class="health-latest-dot" cx="${x(latest.date).toFixed(1)}" cy="${y(latest.value).toFixed(1)}" r="8.2"></circle>
        <rect class="health-percentile-bg" x="${width - margin.right - 92}" y="${margin.top + 8}" width="82" height="42" rx="10"></rect>
        <text class="health-percentile" x="${width - margin.right - 51}" y="${margin.top + 37}" text-anchor="middle">${pct}</text>
        <text class="health-axis-label" x="${(x(latest.date) + 14).toFixed(1)}" y="${(y(latest.value) - 14).toFixed(1)}">${latestText}</text>
      </svg></article>`;

    async function renderHealthCharts() {

      const yearEnd = new Date(`${year}-12-31T12:00:00`);
      const totalDays = Math.round((yearEnd - yearStart) / 86400000);
      const current = cumulativeSeries(runDistances, year);
      const comparison = cumulativeSeries(comparisonRunDistances, year - 1);
      const comparison2024 = cumulativeSeries(comparisonRunDistances2024, year - 2);
      if (!current.points.length) return;

      const yMax = Math.max(50, Math.ceil(Math.max(current.total, comparison.total, comparison2024.total) / 50) * 50);
      const dayOfYear = date => Math.round((date - new Date(`${date.getFullYear()}-01-01T12:00:00`)) / 86400000);
      const x = date => margin.left + (dayOfYear(date) / totalDays) * plotW;
      const y = value => margin.top + plotH - (value / yMax) * plotH;
      const linePath = points => points.map((point, i) => `${i ? "L" : "M"}${x(point.date).toFixed(1)},${y(point.cumulative).toFixed(1)}`).join(" ");
      const monthTicks = Array.from({ length: 12 }, (_, m) => new Date(year, m, 1, 12));
      const yTicks = Array.from({ length: 5 }, (_, i) => Math.round((yMax / 4) * i));
      const itbsStart = new Date(`${year}-02-22T12:00:00`);
      const itbsEnd = new Date(`${year}-05-10T12:00:00`);
      const last = current.points[current.points.length - 1];
      const comparisonLast = comparison.points[comparison.points.length - 1];
      const comparison2024Last = comparison2024.points[comparison2024.points.length - 1];

      svg.innerHTML = `
        <rect class="chart-itbs" x="${x(itbsStart).toFixed(1)}" y="${margin.top}" width="${(x(itbsEnd) - x(itbsStart)).toFixed(1)}" height="${plotH}" rx="9"></rect>
        ${yTicks.map(tick => `<line class="chart-grid" x1="${margin.left}" y1="${y(tick).toFixed(1)}" x2="${width - margin.right}" y2="${y(tick).toFixed(1)}"></line><text class="chart-label" x="${margin.left - 20}" y="${(y(tick) + 8).toFixed(1)}" text-anchor="end">${tick}</text>`).join("")}
        ${monthTicks.map(date => `<line class="chart-grid" x1="${x(date).toFixed(1)}" y1="${margin.top}" x2="${x(date).toFixed(1)}" y2="${height - margin.bottom}" opacity="0.42"></line><text class="chart-label" x="${x(date).toFixed(1)}" y="${height - 36}" text-anchor="middle">${date.toLocaleDateString("en-GB", { month: "short" })}</text>`).join("")}
        <line class="chart-axis" x1="${margin.left}" y1="${height - margin.bottom}" x2="${width - margin.right}" y2="${height - margin.bottom}"></line>
        <line class="chart-axis" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${height - margin.bottom}"></line>
        <text class="chart-note" x="${((x(itbsStart) + x(itbsEnd)) / 2).toFixed(1)}" y="${margin.top + 52}" text-anchor="middle">ITBS</text>
        <path class="chart-line comparison-2024" d="${linePath(comparison2024.points)}"></path>
        <path class="chart-line comparison-2025" d="${linePath(comparison.points)}"></path>
        <path class="chart-line" d="${linePath(current.points)}"></path>
        <circle class="chart-dot" cx="${x(last.date).toFixed(1)}" cy="${y(last.cumulative).toFixed(1)}" r="5.5"></circle>
        <text class="chart-end-label" x="${(x(last.date) + 18).toFixed(1)}" y="${(y(last.cumulative) - 14).toFixed(1)}">2026 · ${current.total}km</text>
        <text class="chart-end-label" x="${(x(comparisonLast.date) + 18).toFixed(1)}" y="${(y(comparisonLast.cumulative) + 34).toFixed(1)}">2025 · ${comparison.total}km</text>
        <text class="chart-end-label" x="${(x(comparison2024Last.date) + 18).toFixed(1)}" y="${(y(comparison2024Last.cumulative) + 34).toFixed(1)}">2024 · ${comparison2024.total}km</text>
      `;
    }

    function weekIndex(date) {
      const yearStart = new Date(`${year}-01-01T12:00:00`);
      const leading = mondayFirstOffset(yearStart);
      return Math.floor((leading + daysBetween(`${year}-01-01`, isoDate(date.getFullYear(), date.getMonth(), date.getDate())) - 1) / 7);
    }
    function renderMonthLabels() {
      calendar.querySelectorAll(".month-label").forEach(label => label.remove());
      const calendarTop = calendar.getBoundingClientRect().top;
      const rowGap = parseFloat(getComputedStyle(calendar).rowGap) || 0;
      for (let month = 0; month < 12; month++) {
        const first = new Date(year, month, 1, 12);
        const last = new Date(year, month + 1, 0, 12);
        const firstIso = isoDate(year, month, 1);
        const lastIso = isoDate(year, month, last.getDate());
        const firstCell = calendar.querySelector(`[data-iso="${firstIso}"]`);
        const lastCell = calendar.querySelector(`[data-iso="${lastIso}"]`);
        if (!firstCell || !lastCell) continue;

        const firstRect = firstCell.getBoundingClientRect();
        const lastRect = lastCell.getBoundingClientRect();
        const firstCellTop = firstRect.top - calendarTop;
        const lastCellTop = lastRect.top - calendarTop;
        const startsAfterRowGap = month > 0 && mondayFirstOffset(first) === 0;
        const endsBeforeRowGap = month < 11 && mondayFirstOffset(last) === 6;
        const top = month === 0
          ? firstCellTop
          : firstCellTop + (mondayFirstOffset(first) / 7) * firstRect.height - (startsAfterRowGap ? rowGap / 2 : 0);
        const bottom = month === 11
          ? lastCellTop + lastRect.height
          : lastCellTop + ((mondayFirstOffset(last) + 1) / 7) * lastRect.height + (endsBeforeRowGap ? rowGap / 2 : 0);
        const monthTotal = monthRunTotal(month);
        const hasMonthStarted = !isCurrentYear || month <= today.getMonth();
        const monthTotalLabel = hasMonthStarted ? ` ${monthTotal}<span class="unit">km</span>` : "";

        const label = document.createElement("div");
        label.className = "month-label";
        label.id = `month-${month + 1}`;
        label.style.top = `${top.toFixed(1)}px`;
        label.style.height = `${Math.max(1, bottom - top).toFixed(1)}px`;
        label.innerHTML = `<span class="month-label-text">${monthNames[month]}<span class="month-total">${monthTotalLabel}</span></span>`;
        calendar.appendChild(label);
      }
    }
    function renderCalendar() {
      calendar.innerHTML = "";
      for (const [index, dow] of dows.entries()) {
        const cell = document.createElement("div");
        cell.className = "dow";
        cell.textContent = dow;
        cell.style.gridColumn = String(index + 2);
        cell.style.gridRow = "1";
        calendar.appendChild(cell);
      }

      const first = new Date(year, 0, 1, 12);
      for (let i = 0; i < mondayFirstOffset(first); i++) {
        const blank = document.createElement("div");
        blank.className = "day empty";
        blank.textContent = "·";
        blank.style.gridColumn = String(i + 2);
        blank.style.gridRow = "2";
        calendar.appendChild(blank);
      }
      const last = new Date(year, 11, 31, 12);
      const trailing = 6 - mondayFirstOffset(last);
      for (let i = 0; i < trailing; i++) {
        const blank = document.createElement("div");
        blank.className = "day empty";
        blank.textContent = "·";
        blank.style.gridColumn = String(mondayFirstOffset(last) + 3 + i);
        blank.style.gridRow = String(weekIndex(last) + 2);
        calendar.appendChild(blank);
      }

      for (let month = 0; month < 12; month++) {
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let day = 1; day <= daysInMonth; day++) {
          const date = new Date(year, month, day, 12);
          const iso = isoDate(year, month, day);
          const isToday = isCurrentYear && today.getMonth() === month && today.getDate() === day;
          const dayEvents = eventsForDate(iso);
          const runDistance = runDistances[iso];
          const cell = document.createElement("div");
          const isWeekend = date.getDay() === 0 || date.getDay() === 6;
          const isPast = isCurrentYear && date < new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12);
          cell.className = `day${isWeekend ? " weekend" : ""}${isPast ? " past" : ""}${isToday ? " today" : ""}`;
          cell.style.gridColumn = String(mondayFirstOffset(date) + 2);
          cell.style.gridRow = String(weekIndex(date) + 2);
          cell.dataset.iso = iso;
          cell.title = dayEvents.length ? dayEvents.map(event => `${event.listTitle} — ${event.meta}`).join("\n") : iso;
          const stack = dayEvents.map(event => {
            const end = event.end || event.start;
            const startsSegment = isStartOfVisibleSegment(event, date);
            if (!startsSegment) return `<div class="event-spacer">&nbsp;</div>`;
            const span = visibleSegmentSpan(event, date);
            const isMulti = span > 1 || event.end;
            const startClass = iso === event.start || date.getDay() === 1 ? " start" : "";
            const endClass = iso === end || date.getDay() === 0 ? " end" : "";
            const width = isMulti ? ` style="width: calc(${span * 100}% + ${(span - 1) * 3}px - 4px)"` : "";
            const title = raceDisplayTitle(event);
            const label = isMulti ? title : `<span class="highlight-text">${title}</span>`;
            return `<div class="event-bar ${event.status} ${isMulti ? "multi" : "single"}${startClass}${endClass}"${width}>${label}</div>`;
          }).join("");
          const runLabel = runDistance ? `<span class="run-distance">${runDistance}<span class="unit">km</span></span>` : "";
          const stretchStreak = stretchStreaks[iso];
          const nextDate = new Date(year, month, day + 1, 12);
          const nextIso = nextDate.getFullYear() === year ? isoDate(nextDate.getFullYear(), nextDate.getMonth(), nextDate.getDate()) : null;
          const isFinalStretchDay = stretchStreak && !stretchStreaks[nextIso];
          const stretchLabel = stretchStreak ? `<span class="stretch-streak" title="Stretch streak">🧘${isFinalStretchDay ? stretchStreak : ""}</span>` : "";
          const absStreak = absStreaks[iso];
          const isFinalAbsDay = absStreak && !absStreaks[nextIso];
          const absLabel = absStreak ? `<span class="abs-streak" title="Strength/abs streak">💪${isFinalAbsDay ? absStreak : ""}</span>` : "";
          cell.innerHTML = `<div class="date-row"><span class="date-number">${day}</span>${stretchLabel}</div><div class="event-stack">${stack}</div>${runLabel}${absLabel}`;
          calendar.appendChild(cell);
        }
      }
      renderMonthLabels();
    }

    renderCalendar();
    document.fonts?.ready.then(renderMonthLabels);
    window.addEventListener("resize", renderMonthLabels);

    renderUpcomingRaces();
    renderDistanceChart();
    renderHealthCharts();

    function currentDayEl() {
      if (!isCurrentYear) return null;
      const iso = isoDate(year, today.getMonth(), today.getDate());
      return document.querySelector(`.day.today[data-iso="${iso}"]`);
    }
    function scrollToToday(options = { behavior: "smooth" }) {
      currentDayEl()?.scrollIntoView({ behavior: options.behavior, block: "center" });
    }
    function scrollToChart() {
      document.getElementById("distance-chart-title")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    async function hardRefresh() {
      if ("serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(registration => registration.update().catch(() => {})));
      }
      const url = new URL(window.location.href);
      url.searchParams.set("refresh", Date.now().toString());
      window.location.replace(url.toString());
    }
    document.querySelector('[data-action="today"]')?.addEventListener("click", scrollToToday);
    document.querySelector('[data-action="chart"]')?.addEventListener("click", scrollToChart);
    document.querySelector('[data-action="refresh"]')?.addEventListener("click", () => { hardRefresh().catch(() => window.location.reload()); });

    if (isCurrentYear) {
      window.addEventListener("load", () => {
        scrollToToday({ behavior: "auto" });
      });
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
