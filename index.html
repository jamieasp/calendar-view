<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClawjCal</title>
  <meta name="theme-color" content="#ffe24d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ClawjCal" />
  <link rel="manifest" href="manifest.webmanifest?v=clawjcal-2" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f2ea;
      --paper: #fffdf8;
      --ink: #17202a;
      --muted: #7b7468;
      --line: #ded6c8;
      --weekend: rgba(120, 120, 120, 0.08);
      --today: #f9d65c;
      --pencil: #16120d;
      --highlighter: rgba(255, 226, 77, 0.62);
      --highlighter-strong: rgba(255, 216, 38, 0.78);
      --pink-highlighter: rgba(255, 147, 190, 0.58);
      --interesting-highlighter: rgba(106, 229, 214, 0.62);
      --school-highlighter: rgba(177, 154, 255, 0.58);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: var(--ink);
    }
    main { width: min(100%, 430px); margin: 0 auto; padding: 24px 12px 112px; background: #fff; }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: -24px -12px 18px;
      padding: 10px 10px 9px;
      background: linear-gradient(180deg, rgba(255, 226, 77, 0.82), rgba(255, 226, 77, 0.66));
      backdrop-filter: blur(24px) saturate(1.45);
      -webkit-backdrop-filter: blur(24px) saturate(1.45);
      border-bottom: 1px solid rgba(120, 98, 22, 0.16);
      box-shadow: 0 10px 24px rgba(50, 40, 25, 0.08), inset 0 1px 0 rgba(255,255,255,0.34), inset 0 -1px 0 rgba(255,255,255,0.18);
    }
    h1 { margin: 0; font-size: clamp(1.65rem, 7vw, 2.35rem); line-height: 0.9; letter-spacing: -0.07em; }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      flex: 0 0 auto;
      box-shadow: 0 3px 10px rgba(50, 40, 25, 0.10);
    }
    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }
    .header-button {
      appearance: none;
      border: 1px solid rgba(120, 98, 22, 0.22);
      border-radius: 999px;
      background: rgba(255,255,255,0.62);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      color: var(--ink);
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      font: inherit;
      font-size: 1.16rem;
      font-weight: 850;
      letter-spacing: -0.02em;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(50, 40, 25, 0.07);
    }
    .material-symbols-outlined {
      font-family: "Material Symbols Outlined";
      font-weight: normal;
      font-style: normal;
      font-size: 1.34rem;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "liga";
    }
    .header-button:hover { background: rgba(255, 247, 220, 0.62); }
    .header-button:active { transform: translateY(1px); }
    .bottom-tabs {
      position: fixed;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 30;
      width: min(calc(100% - 24px), 406px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 5px;
      border: 1px solid rgba(120, 98, 22, 0.16);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.74), rgba(255, 226, 77, 0.40));
      backdrop-filter: blur(24px) saturate(1.45);
      -webkit-backdrop-filter: blur(24px) saturate(1.45);
      box-shadow: 0 14px 34px rgba(50, 40, 25, 0.16), inset 0 1px 0 rgba(255,255,255,0.52);
    }
    .bottom-tab {
      appearance: none;
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      min-height: 38px;
      padding: 7px 4px 8px;
      font: inherit;
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      cursor: pointer;
    }
    .bottom-tab.active {
      color: var(--ink);
      background: rgba(255, 226, 77, 0.72);
      box-shadow: inset 0 0 0 1px rgba(120, 98, 22, 0.14), 0 4px 12px rgba(50, 40, 25, 0.08);
    }
    .sub { color: var(--muted); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.82rem; }
    .expand-years {
      appearance: none;
      display: block;
      width: fit-content;
      margin: 18px auto 0;
      border: 1px solid #d9d0c2;
      border-radius: 16px;
      background: rgba(255, 247, 220, 0.58);
      color: var(--ink);
      padding: 12px 14px;
      font: inherit;
      font-weight: 900;
      letter-spacing: -0.02em;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(50, 40, 25, 0.06);
    }
    .expand-years:active { transform: translateY(1px); }
    .year-grid {
      position: relative;
      display: grid;
      grid-template-columns: 30px repeat(7, minmax(0, 1fr));
      gap: 3px;
      align-items: stretch;
      margin-top: 10px;
    }
    .month-label {
      position: absolute;
      left: 0;
      width: 30px;
      scroll-margin-top: 112px;
      border-radius: 0;
      background: linear-gradient(180deg, rgba(255, 226, 77, 0.32), rgba(255, 226, 77, 0.08));
      overflow: visible;
    }
    .month-label-text {
      position: absolute;
      left: 50%;
      top: 50%;
      display: block;
      width: max-content;
      max-width: none;
      transform: translate(-50%, -50%) rotate(-90deg);
      transform-origin: center;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1;
      letter-spacing: -0.045em;
      text-transform: uppercase;
      font-weight: 900;
      white-space: nowrap;
    }
    .month-total {
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 1.04rem;
      font-weight: 800;
      text-transform: none;
      letter-spacing: -0.02em;
    }
    .month-total .unit { color: var(--muted); margin-left: 1px; }
    .dow { color: var(--muted); font-size: 0.68rem; font-weight: 900; text-align: center; text-transform: uppercase; padding-bottom: 3px; align-self: end; }
    .day {
      min-height: var(--day-min-height, 76px);
      border-radius: 9px;
      border: 1px solid #eadfce;
      padding: 4px 0;
      position: relative;
      background: rgba(255,255,255,0.55);
      overflow: visible;
    }
    .weekend { background: var(--weekend); }
    .past {
      background: rgba(246, 242, 234, 0.38);
      border-color: rgba(234, 223, 206, 0.55);
    }
    .past.weekend { background: rgba(232, 230, 226, 0.42); }
    .past .date-number { color: color-mix(in srgb, var(--muted) 45%, white); }
    .today {
      background: rgba(249, 214, 92, 0.18);
      outline: 2px solid var(--today);
      outline-offset: -2px;
    }
    .empty { opacity: 0; pointer-events: none; }
    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      min-height: 1rem;
      margin: 0 4px 4px;
    }
    .date-number {
      display: block;
      color: color-mix(in srgb, var(--muted) 72%, white);
      font-size: 0.76rem;
      font-weight: 850;
      line-height: 1;
      margin: 0;
    }
    .stretch-streak {
      position: absolute;
      left: 4px;
      bottom: 3px;
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 0.86rem;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      transform: rotate(-2deg);
    }
    .abs-streak {
      position: absolute;
      right: 4px;
      bottom: 3px;
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 0.86rem;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      transform: rotate(2deg);
    }
    .event-stack { display: grid; gap: 2px; position: relative; }
    .event-bar, .event-spacer {
      min-height: 17px;
      border-radius: 4px;
      font-size: 1.05rem;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: -0.02em;
    }
    .event-spacer { visibility: hidden; }
    .event-bar {
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-weight: 800;
      padding: 3px 2px;
      position: relative;
      z-index: 3;
      background: linear-gradient(100deg, transparent 0, var(--highlighter-strong) 2% 98%, transparent 100%);
      box-shadow: none;
      transform: rotate(-0.25deg);
    }
    .event-bar.single {
      display: block;
      white-space: normal;
      overflow-wrap: normal;
      min-height: 0;
      padding: 0 2px;
      border-radius: 0;
      line-height: 1.22;
      background: none;
    }
    .event-bar.single .highlight-text {
      background: linear-gradient(transparent 44%, var(--highlighter-strong) 44% 82%, transparent 82%);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      padding: 0 0.05em;
    }
    .event-bar.multi {
      white-space: nowrap;
      overflow: hidden;
      min-height: 0;
      padding: 0 2px;
      line-height: 1.22;
      border-radius: 0;
    }
    .event-bar.multi.upcoming,
    .event-bar.multi.completed,
    .event-bar.multi.trip { background: linear-gradient(transparent 44%, var(--highlighter) 44% 82%, transparent 82%); }
    .event-bar.multi.injury { background: linear-gradient(transparent 44%, var(--pink-highlighter) 44% 82%, transparent 82%); }
    .event-bar.multi.interesting { background: linear-gradient(transparent 44%, var(--interesting-highlighter) 44% 82%, transparent 82%); }
    .event-bar.multi.school { background: linear-gradient(transparent 44%, var(--school-highlighter) 44% 82%, transparent 82%); }
    .event-bar.single.upcoming,
    .event-bar.single.completed,
    .event-bar.single.trip,
    .event-bar.single.injury,
    .event-bar.single.interesting,
    .event-bar.single.school { background: none; }
    .event-bar.single.injury .highlight-text { background: linear-gradient(transparent 44%, var(--pink-highlighter) 44% 82%, transparent 82%); }
    .event-bar.single.interesting .highlight-text { background: linear-gradient(transparent 44%, var(--interesting-highlighter) 44% 82%, transparent 82%); }
    .event-bar.single.school .highlight-text { background: linear-gradient(transparent 44%, var(--school-highlighter) 44% 82%, transparent 82%); }
    .event-bar.cancelled {
      text-decoration: line-through;
      opacity: 0.74;
    }
    .event-bar.multi.cancelled { background: linear-gradient(transparent 44%, rgba(220, 220, 120, 0.55) 44% 82%, transparent 82%); }
    .event-bar.single.cancelled { background: none; }
    .event-bar.single.cancelled .highlight-text { background: linear-gradient(transparent 44%, rgba(220, 220, 120, 0.55) 44% 82%, transparent 82%); }
    .event-bar.continuation { opacity: 0.82; }
    .event-bar.end { border-top-right-radius: 7px; border-bottom-right-radius: 8px; }
    .event-bar.start { border-top-left-radius: 8px; border-bottom-left-radius: 6px; }
    .run-distance {
      display: block;
      width: fit-content;
      margin: 3px 2px 0;
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 1.11rem;
      font-weight: 800;
      line-height: 1.16;
      white-space: nowrap;
      background: none;
      padding: 0 0.08em;
      transform: rotate(0.2deg);
    }
    .run-distance .unit {
      color: var(--muted);
      margin-left: 1px;
    }

    .races-section {
      margin-top: 56px;
      padding-top: 8px;
      scroll-margin-top: 112px;
    }
    .races-section h2,
    .chart-header h2,
    .health-charts h2 {
      display: inline;
      background: linear-gradient(100deg, transparent 0, var(--highlighter-strong) 4% 96%, transparent 100%);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      padding: 0 0.08em;
    }
    .races-section h2 {
      margin: 0 0 22px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(1.65rem, 3vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.055em;
      line-height: 0.95;
    }
    .race-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 22px 0 0;
      padding: 0;
      list-style: none;
    }
    .race-card {
      border: 1px solid #eadfce;
      border-radius: 14px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.62);
      min-width: 0;
      overflow: hidden;
    }
    .race-name {
      display: block;
      font-weight: 900;
      letter-spacing: -0.035em;
      font-size: 1.18rem;
      line-height: 1.05;
    }
    .race-countdown {
      display: block;
      margin-top: 6px;
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1;
    }
    .race-meta {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-weight: 750;
      font-size: 0.88rem;
      line-height: 1.25;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .race-link {
      color: var(--ink);
      font-weight: 850;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .race-watch {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .chart-section {
      margin-top: 64px;
      padding-top: 12px;
    }
    .chart-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }
    .chart-header h2 {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(1.65rem, 3vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.055em;
      line-height: 0.95;
    }
    .secondary-chart-title {
      margin-top: 32px;
    }
    .secondary-chart-title h2 {
      font-size: clamp(1.65rem, 3vw, 2.8rem);
    }
    .histogram-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 12px 0 4px;
    }
    .histogram-filter {
      appearance: none;
      border: 1px solid rgba(120, 98, 22, 0.26);
      border-radius: 999px;
      background: white;
      color: var(--ink);
      padding: 6px 10px;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 900;
      cursor: pointer;
    }
    .histogram-filter[data-histogram-year="2024"] { background: rgba(255, 226, 77, 0.22); }
    .histogram-filter[data-histogram-year="2025"] { background: rgba(255, 226, 77, 0.50); }
    .histogram-filter[data-histogram-year="2026"] { background: rgba(255, 226, 77, 0.82); }
    .histogram-filter.active {
      box-shadow: inset 0 0 0 2px var(--pencil), 0 3px 8px rgba(21, 37, 54, 0.10);
    }
    .distance-chart {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .chart-axis,
    .chart-grid {
      stroke: #ded6c8;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    .chart-grid { opacity: 0.68; }
    .chart-line {
      fill: none;
      stroke: #17202a;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .chart-line.comparison-2025 {
      stroke: #8f887e;
      stroke-width: 3;
      opacity: 0.86;
    }
    .chart-line.comparison-2024 {
      stroke: #c4beb5;
      stroke-width: 3;
      opacity: 0.9;
    }
    .chart-dot { fill: var(--pencil); }
    .histogram-unit {
      stroke: var(--pencil);
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }
    .histogram-unit.y2024 { fill: rgba(255, 226, 77, 0.22); }
    .histogram-unit.y2025 { fill: rgba(255, 226, 77, 0.50); }
    .histogram-unit.y2026 { fill: rgba(255, 226, 77, 0.82); }
    .histogram-unit-divider {
      stroke: rgba(21, 37, 54, 0.72);
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
    }
    .histogram-latest-unit {
      fill: #152536;
      stroke: var(--pencil);
      stroke-width: 1.8;
      opacity: 0.96;
      vector-effect: non-scaling-stroke;
    }
    .chart-label {
      fill: var(--muted);
      font-size: 24px;
      font-weight: 850;
    }
    .chart-end-highlight {
      fill: var(--highlighter-strong);
      opacity: 0.72;
    }
    .chart-end-label {
      fill: var(--ink);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 34px;
      font-weight: 900;
    }
    .chart-note {
      fill: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 38px;
      font-weight: 800;
    }
    .chart-itbs {
      fill: var(--pink-highlighter);
      opacity: 0.38;
    }
    .health-charts {
      margin-top: 72px;
      padding-top: 12px;
      scroll-margin-top: 112px;
    }
    .health-charts h2 {
      margin: 0 0 18px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(1.65rem, 3vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.055em;
      line-height: 0.95;
    }
    .health-panel {
      margin-top: 28px;
    }
    .health-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .health-daily-dot { fill: #6f8fad; opacity: 0.38; }
    .health-latest-dot { fill: #152536; stroke: white; stroke-width: 2.2; opacity: 0.98; }
    .health-ma3 { fill: none; stroke: #d46a00; stroke-width: 3.5; opacity: 0.95; stroke-linejoin: round; stroke-linecap: round; }
    .health-ma7 { fill: none; stroke: #0b65c2; stroke-width: 4.8; stroke-linejoin: round; stroke-linecap: round; }
    .health-latest-line { stroke: #152536; stroke-width: 2.9; stroke-dasharray: 3 6; opacity: 0.55; }
    .health-jan-band { fill: var(--today); opacity: 0.22; }
    .health-event-line { stroke-width: 3; stroke-dasharray: 2 6; opacity: 0.9; }
    .health-run-icon { stroke: #111; fill: none; stroke-width: 2.1; stroke-linecap: round; opacity: 0.9; }
    .health-run-head { fill: #111; opacity: 0.9; }
    .health-rug { stroke: var(--today); stroke-width: 2; opacity: 0.70; stroke-linecap: round; }
    .health-rug-latest { stroke: #152536; stroke-width: 4.2; opacity: 0.94; stroke-linecap: round; }
    .health-title { fill: var(--ink); font-size: 38px; font-weight: 900; }
    .health-axis-label { fill: var(--muted); font-size: 24px; font-weight: 850; }
    .health-event-highlight,
    .health-percentile-bg { fill: var(--highlighter-strong); opacity: 0.72; }
    .health-event-label,
    .health-percentile,
    .health-current-label {
      fill: var(--ink);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 34px;
      font-weight: 900;
    }
    .health-grid { stroke: #9aa7b1; stroke-width: 1; opacity: 0.16; }
    .health-y-grid { stroke: #9aa7b1; stroke-width: 1; opacity: 0.25; }
    .health-axis { stroke: #ded6c8; stroke-width: 1.3; }


    @media (max-width: 760px) {
      main { width: 100vw; max-width: none; }
      .header-button { width: 38px; height: 38px; font-size: 1.05rem; }
      .day { min-height: var(--day-min-height, 66px); }
      .event-bar { font-size: 1.03rem; }
    }
    @media print {
      body { background: white; }
      main { max-width: none; padding: 0; }
      header { position: static; margin: 0 0 8px; padding: 0; border: 0; background: transparent; }
      .header-actions { display: none; }
      .bottom-tabs { display: none; }

    function isRaceEvent(event) {
      const text = `${event.title} ${event.listTitle || ""}`;
      return Boolean(event.race || /\b(utmb|maverick|jurassic|copper|st sunday|race|skyrace|skytrail|trail run)\b/i.test(text));
    }
    function raceDisplayTitle(event) {
      const title = event.title.replace(/^🏁\s*/, "");
      return isRaceEvent(event) ? `🏁 ${title}` : title;
    }

    function mondayFirstOffset(date) {
      return (date.getDay() + 6) % 7;
    }
    function isoDate(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
    function dateLabel(iso) {
      return new Date(`${iso}T12:00:00`).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    }
    function eventsForDate(iso) {
      return events.filter(event => iso >= event.start && iso <= (event.end || event.start));
    }
    function isStartOfVisibleSegment(event, date) {
      const iso = isoDate(date.getFullYear(), date.getMonth(), date.getDate());
      return iso === event.start || date.getDay() === 1;
    }
    function daysBetween(startIso, endIso) {
      const start = new Date(`${startIso}T12:00:00`);
      const end = new Date(`${endIso}T12:00:00`);
      return Math.round((end - start) / 86400000) + 1;
    }
    function visibleSegmentSpan(event, date) {
      const iso = isoDate(date.getFullYear(), date.getMonth(), date.getDate());
      const end = event.end || event.start;
      const daysLeftInWeek = 7 - ((date.getDay() + 6) % 7);
      const daysLeftInEvent = daysBetween(iso, end);
      return Math.max(1, Math.min(daysLeftInWeek, daysLeftInEvent));
    }
    function monthRunTotal(totalYear, month) {
      const prefix = `${totalYear}-${String(month + 1).padStart(2, "0")}-`;
      return Object.entries(runDistances)
        .filter(([iso]) => iso.startsWith(prefix))
        .reduce((sum, [, km]) => sum + Number(km || 0), 0);
    }
    function renderRaceList(listId, status) {

        .sort((a, b) => a.date - b.date);
      list.innerHTML = races.map(event => {
        const daysLeft = Math.ceil((event.date - todayStart) / 86400000);
        const dayLabel = daysLeft === 0 ? "today" : `${daysLeft} day${daysLeft === 1 ? "" : "s"}`;

      }).join("");

    function cumulativeSeries(distances, seriesYear) {
      const seriesStart = new Date(`${seriesYear}-01-01T12:00:00`);
      const points = [{ iso: `${seriesYear}-01-01`, date: seriesStart, km: 0, cumulative: 0 }];
      let cumulative = 0;
      const entries = Object.entries(distances)
        .sort(([a], [b]) => a.localeCompare(b))
        .map(([iso, km]) => ({ iso, date: new Date(`${iso}T12:00:00`), km }));
      for (const entry of entries) {
        cumulative += Number(entry.km || 0);
        points.push({ ...entry, cumulative });
      }
      return { points, total: Math.round(cumulative) };
    }
    function centeredMA(values, windowSize) {
      const left = Math.floor((windowSize - 1) / 2);
      const right = Math.floor(windowSize / 2);
      return values.map((_, index) => {
        const lo = Math.max(0, index - left);
        const hi = Math.min(values.length, index + right + 1);
        return values.slice(lo, hi).reduce((sum, value) => sum + value, 0) / (hi - lo);
      });
    }
    function dateFromIso(iso) {
      return new Date(`${iso}T12:00:00`);
    }
    function svgPath(points, x, y) {
      return points.map((point, index) => `${index ? "L" : "M"}${x(point.date).toFixed(1)},${y(point.value).toFixed(1)}`).join(" ");
    }
    function mondayDates(startDate, endDate) {
      const dates = [];
      const cur = new Date(startDate);
      cur.setDate(cur.getDate() + ((8 - cur.getDay()) % 7));
      while (cur <= endDate) {
        dates.push(new Date(cur));
        cur.setDate(cur.getDate() + 7);
      }
      return dates;
    }
    function healthRunIcon(x, y) {
      return `<g class="health-run-icon" transform="translate(${(x - 7).toFixed(1)} ${(y - 14).toFixed(1)})">
        <circle class="health-run-head" cx="7" cy="3" r="2.1"></circle>
        <path d="M7 5.5 L6 8.4 M6 7.2 L3.3 6.2 M6 7.2 L9.4 6.6 M6 8.4 L3.8 12.2 M6 8.4 L9.8 12.0"></path>
      </g>`;
    }
    function niceNumber(value, round = false) {
      if (!Number.isFinite(value) || value <= 0) return 1;
      const exponent = Math.floor(Math.log10(value));
      const fraction = value / Math.pow(10, exponent);
      const niceFraction = round
        ? (fraction < 1.5 ? 1 : fraction < 3 ? 2 : fraction < 7 ? 5 : 10)
        : (fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10);
      return niceFraction * Math.pow(10, exponent);
    }
    function niceTicks(min, max, targetCount = 5) {
      if (!Number.isFinite(min) || !Number.isFinite(max)) return [0, 1];
      if (min === max) {
        const step = niceNumber(Math.abs(min) || 1, true);
        min -= step;
        max += step;
      }
      const span = niceNumber(max - min, false);
      const step = niceNumber(span / Math.max(1, targetCount - 1), true);
      const niceMin = Math.floor(min / step) * step;
      const niceMax = Math.ceil(max / step) * step;
      const ticks = [];
      const decimals = Math.max(0, -Math.floor(Math.log10(step)));
      for (let value = niceMin; value <= niceMax + step * 0.5; value += step) {
        ticks.push(Number(value.toFixed(decimals + 1)));
      }
      return ticks;
    }
    function tickPrecision(ticks) {
      const step = Math.abs((ticks[1] ?? ticks[0] + 1) - ticks[0]);
      if (step >= 1) return 0;
      if (step >= 0.1) return 1;
      return 2;
    }
    function renderHealthPanel(panel, data) {
      const width = 1500;
      const height = 620;
      const margin = { top: 88, right: 118, bottom: 74, left: 112 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const points = panel.points.map(point => ({ date: dateFromIso(point.date), iso: point.date, value: Number(point.value) }));
      if (!points.length) return "";
      const values = points.map(point => point.value);
      const ymin = Math.min(...values);
      const ymax = Math.max(...values);
      const yr = ymax - ymin || 1;
      const yDomainMin = ymin - yr * 0.18;
      const yDomainMax = ymax + yr * 0.18;
      const start = points[0].date;
      const end = points[points.length - 1].date;
      const spanDays = Math.max(1, Math.round((end - start) / 86400000));
      const x = date => margin.left + ((date - start) / 86400000 / spanDays) * plotW;
      const yTicks = niceTicks(yDomainMin, yDomainMax, 5);
      const yNiceMin = yTicks[0];
      const yNiceMax = yTicks[yTicks.length - 1];
      const yPrecision = Math.max(tickPrecision(yTicks), panel.kind === "RHR" ? 0 : 1);
      const y = value => margin.top + plotH - ((value - yNiceMin) / (yNiceMax - yNiceMin)) * plotH;
      const ma3 = centeredMA(values, 3).map((value, index) => ({ date: points[index].date, value }));
      const ma7 = centeredMA(values, 7).map((value, index) => ({ date: points[index].date, value }));
      const monthTicks = [];
      const monthCursor = new Date(start.getFullYear(), start.getMonth(), 1, 12);
      while (monthCursor <= end) {
        if (monthCursor >= start) monthTicks.push(new Date(monthCursor));
        monthCursor.setMonth(monthCursor.getMonth() + 1);
      }
      const janValues = points.filter(point => point.date.getFullYear() === 2026 && point.date.getMonth() === 0).map(point => point.value);
      let janBand = "";
      if (janValues.length >= 2) {
        const avg = janValues.reduce((sum, value) => sum + value, 0) / janValues.length;
        const sd = Math.sqrt(janValues.reduce((sum, value) => sum + (value - avg) ** 2, 0) / (janValues.length - 1));
        janBand = `<rect class="health-jan-band" x="${margin.left}" y="${y(avg + sd).toFixed(1)}" width="${plotW}" height="${Math.max(0, y(avg - sd) - y(avg + sd)).toFixed(1)}"></rect>`;
      }
      const latest = points[points.length - 1];
      const iconY = y(ymin - yr * 0.055);
      const longRuns = data.longRunDates
        .map(dateFromIso)
        .filter(date => date >= start && date <= end)
        .map(date => healthRunIcon(x(date), iconY))
        .join("");
      const events = data.eventMarkers
        .filter(marker => dateFromIso(marker.date) >= start && dateFromIso(marker.date) <= end)
        .map(marker => {
          const markerDate = dateFromIso(marker.date);
          const labelX = x(markerDate) + 8;
          const labelY = margin.top + (1 - marker.yoff) * 70;
          const labelWidth = Math.max(74, marker.label.length * 18);
          return `<line class="health-event-line" x1="${x(markerDate).toFixed(1)}" y1="${margin.top}" x2="${x(markerDate).toFixed(1)}" y2="${height - margin.bottom}" stroke="${marker.color}"></line>
            <rect class="health-event-highlight" x="${(labelX + 2).toFixed(1)}" y="${(labelY - 27).toFixed(1)}" width="${labelWidth.toFixed(1)}" height="26" rx="5" transform="rotate(-1.6 ${(labelX + labelWidth / 2).toFixed(1)} ${(labelY - 14).toFixed(1)})"></rect>
            <text class="health-event-label" x="${(labelX + 8).toFixed(1)}" y="${labelY.toFixed(1)}">${marker.label}</text>`;
        }).join("");
      const rug = panel.kind === "RHR" ? "" : values.map((value, index) => {
        const jitter = Math.max(yr * 0.018, 0.28) * Math.sin(index * 12.9898) * 0.85;

        return `<line class="health-rug" x1="${(width - margin.right + 22).toFixed(1)}" y1="${yy.toFixed(1)}" x2="${(width - margin.right + 50).toFixed(1)}" y2="${yy.toFixed(1)}"></line>`;
      }).join("") + (panel.kind === "RHR" ? "" : `<line class="health-rug-latest" x1="${(width - margin.right + 10).toFixed(1)}" y1="${y(latest.value).toFixed(1)}" x2="${(width - margin.right + 50).toFixed(1)}" y2="${y(latest.value).toFixed(1)}"></line>`);
      const pct = panel.latestPercentile == null ? "" : `P${Math.round(panel.latestPercentile)}`;
      const latestText = `${latest.value.toFixed(panel.kind === "RHR" ? 0 : 1)}${panel.unit ? ` ${panel.unit}` : ""}`;
      return `<article class="health-panel"><svg class="health-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${panel.title}">
        ${janBand}
        ${mondayDates(start, end).map(date => `<line class="health-grid" x1="${x(date).toFixed(1)}" y1="${margin.top}" x2="${x(date).toFixed(1)}" y2="${height - margin.bottom}"></line>`).join("")}
        ${yTicks.map(tick => `<line class="health-y-grid" x1="${margin.left}" y1="${y(tick).toFixed(1)}" x2="${width - margin.right}" y2="${y(tick).toFixed(1)}"></line><text class="health-axis-label" x="${margin.left - 14}" y="${(y(tick) + 6).toFixed(1)}" text-anchor="end">${tick.toFixed(yPrecision)}</text>`).join("")}
        ${monthTicks.map(date => `<text class="health-axis-label" x="${x(date).toFixed(1)}" y="${height - 21}" text-anchor="middle">${date.toLocaleDateString("en-GB", { month: "short" })}</text>`).join("")}
        <line class="health-axis" x1="${margin.left}" y1="${height - margin.bottom}" x2="${width - margin.right}" y2="${height - margin.bottom}"></line>
        <line class="health-axis" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${height - margin.bottom}"></line>
        <text class="health-title" x="${margin.left}" y="46">${panel.title}</text>
        <text class="health-axis-label" x="22" y="${margin.top + plotH / 2}" text-anchor="middle" transform="rotate(-90 22 ${margin.top + plotH / 2})">${panel.ylabel}</text>
        <path class="health-ma3" d="${svgPath(ma3, x, y)}"></path>
        <path class="health-ma7" d="${svgPath(ma7, x, y)}"></path>
        <line class="health-latest-line" x1="${margin.left}" y1="${y(latest.value).toFixed(1)}" x2="${width - margin.right}" y2="${y(latest.value).toFixed(1)}"></line>
        ${points.map(point => `<circle class="health-daily-dot" cx="${x(point.date).toFixed(1)}" cy="${y(point.value).toFixed(1)}" r="4.6"></circle>`).join("")}
        ${events}
        ${longRuns}
        ${rug}
        <circle class="health-latest-dot" cx="${x(latest.date).toFixed(1)}" cy="${y(latest.value).toFixed(1)}" r="8.2"></circle>
        <rect class="health-percentile-bg" x="${width - margin.right - 93}" y="${margin.top + 13}" width="76" height="28" rx="5" transform="rotate(1.4 ${width - margin.right - 55} ${margin.top + 27})"></rect>
        <text class="health-percentile" x="${width - margin.right - 55}" y="${margin.top + 39}" text-anchor="middle">${pct}</text>
        <text class="health-current-label" x="${(x(latest.date) + 14).toFixed(1)}" y="${(y(latest.value) - 14).toFixed(1)}">${latestText}</text>
      </svg></article>`;
    }
    async function renderHealthCharts() {
      const container = document.getElementById("health-charts");

      const dayOfYear = date => Math.round((date - new Date(`${date.getFullYear()}-01-01T12:00:00`)) / 86400000);
      const x = date => margin.left + (dayOfYear(date) / totalDays) * plotW;
      const y = value => margin.top + plotH - (value / yMax) * plotH;
      const linePath = points => points.map((point, i) => `${i ? "L" : "M"}${x(point.date).toFixed(1)},${y(point.cumulative).toFixed(1)}`).join(" ");
      const monthTicks = Array.from({ length: 12 }, (_, m) => new Date(year, m, 1, 12));
      const last = current.points[current.points.length - 1];

      svg.innerHTML = `
        ${yTicks.map(tick => `<line class="chart-grid" x1="${margin.left}" y1="${y(tick).toFixed(1)}" x2="${width - margin.right}" y2="${y(tick).toFixed(1)}"></line><text class="chart-label" x="${margin.left - 20}" y="${(y(tick) + 8).toFixed(1)}" text-anchor="end">${tick}</text>`).join("")}
        ${monthTicks.map(date => `<line class="chart-grid" x1="${x(date).toFixed(1)}" y1="${margin.top}" x2="${x(date).toFixed(1)}" y2="${height - margin.bottom}" opacity="0.42"></line><text class="chart-label" x="${x(date).toFixed(1)}" y="${height - 34}" text-anchor="middle">${date.toLocaleDateString("en-GB", { month: "short" })}</text>`).join("")}
        <line class="chart-axis" x1="${margin.left}" y1="${height - margin.bottom}" x2="${width - margin.right}" y2="${height - margin.bottom}"></line>
        <line class="chart-axis" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${height - margin.bottom}"></line>
        <text class="chart-label" x="35" y="${margin.top + plotH / 2}" text-anchor="middle" transform="rotate(-90 35 ${margin.top + plotH / 2})">metres climbed</text>
        <path class="chart-line" d="${linePath(current.points)}"></path>
        <circle class="chart-dot" cx="${x(last.date).toFixed(1)}" cy="${y(last.cumulative).toFixed(1)}" r="5.5"></circle>
        ${chartEndLabel(x(last.date) + 42, y(last.cumulative) - 22, ["2026", `${Math.round(current.total).toLocaleString("en-GB")}m`])}
      `;
    }

    function renderRunDensityChart() {
      const svg = document.getElementById("run-density-chart");
      if (!svg) return;
      const yearlySources = [
        { year: 2024, distances: comparisonRunDistances2024 },
        { year: 2025, distances: comparisonRunDistances },
        { year: 2026, distances: runDistances },
      ];
      const allDailyDistances = yearlySources.flatMap(source => {
        const dailyByIso = Object.entries(source.distances).reduce((days, [iso, km]) => {
          days[iso] = (days[iso] || 0) + Number(km || 0);
          return days;
        }, {});
        return Object.entries(dailyByIso)
          .map(([iso, km]) => ({ iso, year: source.year, date: dateFromIso(iso), km }))
          .filter(day => day.km > 0);
      }).sort((a, b) => a.date - b.date);
      const activeSources = histogramYearFilter === "all"
        ? yearlySources
        : yearlySources.filter(source => String(source.year) === histogramYearFilter);
      const dailyDistances = activeSources.flatMap(source => {
        const dailyByIso = Object.entries(source.distances).reduce((days, [iso, km]) => {
          days[iso] = (days[iso] || 0) + Number(km || 0);
          return days;
        }, {});
        return Object.entries(dailyByIso)
          .map(([iso, km]) => ({ iso, year: source.year, date: dateFromIso(iso), km }))
          .filter(day => day.km > 0);
      }).sort((a, b) => a.date - b.date);
      if (!dailyDistances.length) return;

      const width = 1500;
      const height = 860;
      const margin = { top: 58, right: 86, bottom: 86, left: 98 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const maxDistance = Math.ceil(Math.max(...allDailyDistances.map(day => day.km)));
      const domainMax = Math.max(20, Math.ceil(maxDistance / 5) * 5);
      const axisBuckets = Array.from({ length: domainMax + 1 }, (_, km) => ({ km, days: [] }));
      allDailyDistances.forEach(day => {
        const bucket = Math.min(domainMax, Math.max(0, Math.floor(day.km)));
        axisBuckets[bucket].days.push(day);
      });
      const buckets = Array.from({ length: domainMax + 1 }, (_, km) => ({ km, days: [] }));
      dailyDistances.forEach(day => {
        const bucket = Math.min(domainMax, Math.max(0, Math.floor(day.km)));
        buckets[bucket].days.push(day);
      });
      buckets.forEach(bucket => bucket.days.sort((a, b) => b.year - a.year || a.date - b.date));
      const maxCount = Math.max(1, ...axisBuckets.map(bucket => bucket.days.length));
      const yTicks = niceTicks(0, maxCount, 5).filter(tick => tick >= 0);
      const yMax = yTicks[yTicks.length - 1];
      const x = value => margin.left + (value / domainMax) * plotW;
      const y = count => margin.top + plotH - (count / yMax) * plotH;
      const baseline = margin.top + plotH;
      const xTicks = Array.from({ length: Math.floor(domainMax / 5) + 1 }, (_, index) => index * 5);
      const latest = allDailyDistances.at(-1);
      const latestVisible = histogramYearFilter === "all" || histogramYearFilter === String(latest?.year);
      const latestBucketIndex = latest && latestVisible ? Math.min(domainMax, Math.max(0, Math.floor(latest.km))) : null;
      const avg = dailyDistances.reduce((sum, day) => sum + day.km, 0) / dailyDistances.length;
      const barGap = 3;
      const barWidth = Math.max(2, (plotW / (domainMax + 1)) - barGap);
      const unitHeight = plotH / yMax;
      const bars = buckets.map(bucket => {
        if (!bucket.days.length) return "";
        const bx = x(bucket.km) + barGap / 2;
        const units = bucket.days.map((day, index) => {
          const yy = baseline - unitHeight * (index + 1);
          const isLatest = latestVisible && latest && day.iso === latest.iso && day.year === latest.year;
          const cls = isLatest ? "histogram-latest-unit" : `histogram-unit y${day.year}`;
          const label = isLatest ? `Latest day: ${day.km.toFixed(day.km % 1 ? 1 : 0)}km` : `${day.iso}: ${day.km.toFixed(day.km % 1 ? 1 : 0)}km`;
          return `<rect class="${cls}" x="${bx.toFixed(1)}" y="${yy.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${unitHeight.toFixed(1)}" rx="5"><title>${label}</title></rect>`;
        }).join("");
        const dividers = Array.from({ length: bucket.days.length - 1 }, (_, index) => {
          const yy = baseline - unitHeight * (index + 1);
          return `<line class="histogram-unit-divider" x1="${bx.toFixed(1)}" y1="${yy.toFixed(1)}" x2="${(bx + barWidth).toFixed(1)}" y2="${yy.toFixed(1)}"></line>`;
        }).join("");
        return `${units}${dividers}`;
      }).join("");

      svg.innerHTML = `
        <text class="chart-label" x="${width - margin.right}" y="42" text-anchor="end">${histogramYearFilter === "all" ? "2024–26" : histogramYearFilter} · latest day ${latest ? latest.km.toFixed(latest.km % 1 ? 1 : 0) : "—"}km · avg ${avg.toFixed(1)}km</text>
        ${xTicks.map(tick => `<line class="chart-grid" x1="${x(tick).toFixed(1)}" y1="${margin.top}" x2="${x(tick).toFixed(1)}" y2="${baseline}" opacity="0.36"></line><text class="chart-label" x="${x(tick).toFixed(1)}" y="${height - 30}" text-anchor="middle">${tick}</text>`).join("")}
        ${yTicks.map(tick => `<line class="chart-grid" x1="${margin.left}" y1="${y(tick).toFixed(1)}" x2="${width - margin.right}" y2="${y(tick).toFixed(1)}" opacity="0.38"></line><text class="chart-label" x="${margin.left - 20}" y="${(y(tick) + 8).toFixed(1)}" text-anchor="end">${tick}</text>`).join("")}
        <line class="chart-axis" x1="${margin.left}" y1="${baseline}" x2="${width - margin.right}" y2="${baseline}"></line>
        <line class="chart-axis" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${baseline}"></line>
        <text class="chart-label" x="${width - margin.right}" y="${height - 30}" text-anchor="end">km</text>
        ${bars}
      `;
    }

    function weekIndex(date, firstVisibleMonth = visibleDisplayMonths()[0]) {
      const calendarStart = new Date(firstVisibleMonth.year, firstVisibleMonth.month, 1, 12);
      const leading = mondayFirstOffset(calendarStart);
      return Math.floor((leading + daysBetween(isoDate(firstVisibleMonth.year, firstVisibleMonth.month, 1), isoDate(date.getFullYear(), date.getMonth(), date.getDate())) - 1) / 7);
    }
    function renderMonthLabels() {
      calendar.querySelectorAll(".month-label").forEach(label => label.remove());
      const calendarTop = calendar.getBoundingClientRect().top;
      const rowGap = parseFloat(getComputedStyle(calendar).rowGap) || 0;
      const visibleMonths = visibleDisplayMonths();
      if (!visibleMonths.length) return;
      visibleMonths.forEach(({ year: labelYear, month }, index) => {
        const first = new Date(labelYear, month, 1, 12);
        const last = new Date(labelYear, month + 1, 0, 12);
        const firstIso = isoDate(labelYear, month, 1);
        const lastIso = isoDate(labelYear, month, last.getDate());
        const firstCell = calendar.querySelector(`[data-iso="${firstIso}"]`);
        const lastCell = calendar.querySelector(`[data-iso="${lastIso}"]`);
        if (!firstCell || !lastCell) return;

        const firstRect = firstCell.getBoundingClientRect();
        const lastRect = lastCell.getBoundingClientRect();
        const firstCellTop = firstRect.top - calendarTop;
        const lastCellTop = lastRect.top - calendarTop;
        const startsAfterRowGap = index > 0 && mondayFirstOffset(first) === 0;
        const endsBeforeRowGap = index < visibleMonths.length - 1 && mondayFirstOffset(last) === 6;
        const top = index === 0
          ? firstCellTop
          : firstCellTop + (mondayFirstOffset(first) / 7) * firstRect.height - (startsAfterRowGap ? rowGap / 2 : 0);
        const bottom = index === visibleMonths.length - 1
          ? lastCellTop + lastRect.height
          : lastCellTop + ((mondayFirstOffset(last) + 1) / 7) * lastRect.height + (endsBeforeRowGap ? rowGap / 2 : 0);
        const monthTotal = monthRunTotal(labelYear, month);
        const hasMonthStarted = new Date(labelYear, month, 1, 12) <= new Date(today.getFullYear(), today.getMonth(), 1, 12);
        const monthTotalLabel = hasMonthStarted ? ` ${monthTotal}<span class="unit">km</span>` : "";
        const monthTitle = `${monthNames[month]}${labelYear !== calendarStartYear ? ` ${labelYear}` : ""}`;

        const label = document.createElement("div");
        label.className = "month-label";
        label.id = `month-${labelYear}-${month + 1}`;
        label.style.top = `${top.toFixed(1)}px`;
        label.style.height = `${Math.max(1, bottom - top).toFixed(1)}px`;
        label.innerHTML = `<span class="month-label-text">${monthTitle}<span class="month-total">${monthTotalLabel}</span></span>`;
        calendar.appendChild(label);
      });
    }
    function resizeCalendarRows() {
      const rowHeights = new Map();
      calendar.querySelectorAll(".day:not(.empty)").forEach(cell => {
        const row = cell.dataset.row;
        if (!row) return;
        cell.style.removeProperty("--day-min-height");
        rowHeights.set(row, Math.max(rowHeights.get(row) || 76, cell.scrollHeight + 6));
      });
      rowHeights.forEach((height, row) => {
        calendar.querySelectorAll(`.day[data-row="${row}"]`).forEach(cell => {
          cell.style.setProperty("--day-min-height", `${Math.ceil(height)}px`);
        });
      });
    }
    function renderCalendar() {
      calendar.innerHTML = "";
      for (const [index, dow] of dows.entries()) {
        const cell = document.createElement("div");
        cell.className = "dow";
        cell.textContent = dow;
        cell.style.gridColumn = String(index + 2);
        cell.style.gridRow = "1";
        calendar.appendChild(cell);
      }

      const visibleMonths = visibleDisplayMonths();
      const firstMonth = visibleMonths[0];
      const lastMonth = visibleMonths[visibleMonths.length - 1];
      const first = new Date(firstMonth.year, firstMonth.month, 1, 12);
      for (let i = 0; i < mondayFirstOffset(first); i++) {
        const blank = document.createElement("div");
        blank.className = "day empty";
        blank.textContent = "·";
        blank.style.gridColumn = String(i + 2);
        blank.style.gridRow = "2";
        calendar.appendChild(blank);
      }
      const last = new Date(lastMonth.year, lastMonth.month + 1, 0, 12);
      const trailing = 6 - mondayFirstOffset(last);
      for (let i = 0; i < trailing; i++) {
        const blank = document.createElement("div");
        blank.className = "day empty";
        blank.textContent = "·";
        blank.style.gridColumn = String(mondayFirstOffset(last) + 3 + i);
        blank.style.gridRow = String(weekIndex(last, firstMonth) + 2);
        calendar.appendChild(blank);
      }

      visibleMonths.forEach(({ year: renderYear, month }) => {
        const daysInMonth = new Date(renderYear, month + 1, 0).getDate();
        for (let day = 1; day <= daysInMonth; day++) {
          const date = new Date(renderYear, month, day, 12);
          const iso = isoDate(renderYear, month, day);
          const isToday = today.getFullYear() === renderYear && today.getMonth() === month && today.getDate() === day;
          const dayEvents = eventsForDate(iso);
          const runDistance = runDistances[iso];
          const stretchStreak = stretchStreaks[iso];
          const absStreak = absStreaks[iso];
          const row = weekIndex(date, firstMonth) + 2;
          const cell = document.createElement("div");
          const isWeekend = date.getDay() === 0 || date.getDay() === 6;
          const isPast = date < new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12);
          cell.className = `day${isWeekend ? " weekend" : ""}${isPast ? " past" : ""}${isToday ? " today" : ""}`;
          cell.style.gridColumn = String(mondayFirstOffset(date) + 2);
          cell.style.gridRow = String(row);
          cell.dataset.iso = iso;
          cell.dataset.row = String(row);
          cell.title = dayEvents.length ? dayEvents.map(event => `${event.listTitle} — ${event.meta}`).join("\n") : iso;
          const stack = dayEvents.map(event => {
            const end = event.end || event.start;
            const startsSegment = isStartOfVisibleSegment(event, date);
            if (!startsSegment) return `<div class="event-spacer">&nbsp;</div>`;
            const span = visibleSegmentSpan(event, date);
            const isMulti = span > 1 || event.end;
            const startClass = iso === event.start || date.getDay() === 1 ? " start" : "";
            const endClass = iso === end || date.getDay() === 0 ? " end" : "";
            const width = isMulti ? ` style="width: calc(${span * 100}% + ${(span - 1) * 3}px - 4px)"` : "";
            const title = raceDisplayTitle(event);
            const label = isMulti ? title : `<span class="highlight-text">${title}</span>`;
            return `<div class="event-bar ${event.status} ${isMulti ? "multi" : "single"}${startClass}${endClass}"${width}>${label}</div>`;
          }).join("");
          const runLabel = runDistance ? `<span class="run-distance">${runDistance}<span class="unit">km</span></span>` : "";
          const nextDate = new Date(year, month, day + 1, 12);
          const nextIso = isoDate(nextDate.getFullYear(), nextDate.getMonth(), nextDate.getDate());
          const isFinalStretchDay = stretchStreak && !stretchStreaks[nextIso];
          const stretchLabel = stretchStreak ? `<span class="stretch-streak" title="Stretch streak">🧘${isFinalStretchDay ? stretchStreak : ""}</span>` : "";
          const isFinalAbsDay = absStreak && !absStreaks[nextIso];
          const absLabel = absStreak ? `<span class="abs-streak" title="Strength/abs streak">💪${isFinalAbsDay ? absStreak : ""}</span>` : "";
          cell.innerHTML = `<div class="date-row"><span class="date-number">${day}</span></div><div class="event-stack">${stack}</div>${runLabel}${stretchLabel}${absLabel}`;
          calendar.appendChild(cell);
        }
      });
      resizeCalendarRows();
      renderMonthLabels();
    }

    renderCalendar();
    document.fonts?.ready.then(() => {
      resizeCalendarRows();
      renderMonthLabels();
    });
    window.addEventListener("resize", () => {
      resizeCalendarRows();
      renderMonthLabels();
    });

    renderUpcomingRaces();
    renderDistanceChart();
    renderElevationChart();
    renderRunDensityChart();
    renderHealthCharts();

    function currentDayEl() {
      const iso = isoDate(today.getFullYear(), today.getMonth(), today.getDate());
      return document.querySelector(`.day.today[data-iso="${iso}"]`);
    }
    function setActiveTab(tab) {
      document.querySelectorAll(".bottom-tab").forEach(button => {
        button.classList.toggle("active", button.dataset.tab === tab);
      });
    }
    function scrollToToday(options = { behavior: "smooth" }) {
      currentDayEl()?.scrollIntoView({ behavior: options.behavior, block: "center" });
      setActiveTab("calendar");
    }
    function scrollToCalendar() {
      scrollToToday({ behavior: "smooth" });
    }
    function scrollToChart() {
      document.querySelector(".health-charts")?.scrollIntoView({ behavior: "smooth", block: "start" });
      setActiveTab("charts");
    }
    function scrollToLists() {
      document.querySelector(".races-section")?.scrollIntoView({ behavior: "smooth", block: "start" });
      setActiveTab("races");
    }
    function toggleEarlier() {
      showEarlier = !showEarlier;
      const button = document.querySelector('[data-action="toggle-earlier"]');
      if (button) {
        button.textContent = showEarlier ? "Hide earlier" : "Show earlier";
        button.setAttribute("aria-expanded", String(showEarlier));
      }
      renderCalendar();
      if (!showEarlier) {
        calendar.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }
    function toggle2027() {
      show2027 = !show2027;
      const button = document.querySelector('[data-action="toggle-2027"]');
      if (button) {
        button.textContent = show2027 ? "Hide 2027" : "Show 2027";
        button.setAttribute("aria-expanded", String(show2027));
      }
      renderCalendar();
      if (!show2027) {
        document.querySelector('[data-iso="2026-12-31"]')?.scrollIntoView({ behavior: "smooth", block: "end" });
      }
    }
    async function hardRefresh() {
      if ("serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(registration => registration.update().catch(() => {})));
      }
      const url = new URL(window.location.href);
      url.searchParams.set("refresh", Date.now().toString());
      window.location.replace(url.toString());
    }
    async function copyCalendarUrl() {
      const button = document.querySelector('[data-action="copy-url"]');
      const icon = button?.querySelector(".material-symbols-outlined");
      const originalTitle = button?.title || "Copy URL";
      const originalIcon = icon?.textContent || "content_copy";
      const url = `${window.location.origin}${window.location.pathname}`;
      await navigator.clipboard.writeText(url);
      if (button) {
        button.title = "Copied";
        button.setAttribute("aria-label", "Copied calendar URL");
      }
      if (icon) icon.textContent = "check";
      window.setTimeout(() => {
        if (button) {
          button.title = originalTitle;
          button.setAttribute("aria-label", "Copy calendar URL");
        }
        if (icon) icon.textContent = originalIcon;
      }, 1400);
    }
    document.querySelectorAll(".bottom-tab").forEach(button => {
      button.addEventListener("click", () => {
        if (button.dataset.tab === "calendar") scrollToCalendar();
        if (button.dataset.tab === "charts") scrollToChart();
        if (button.dataset.tab === "races") scrollToLists();
      });
    });
    document.querySelectorAll(".histogram-filter").forEach(button => {
      button.addEventListener("click", () => {
        histogramYearFilter = button.dataset.histogramYear || "all";
        document.querySelectorAll(".histogram-filter").forEach(filter => filter.classList.toggle("active", filter === button));
        renderRunDensityChart();
      });
    });
    document.querySelector('[data-action="toggle-earlier"]')?.addEventListener("click", toggleEarlier);
    document.querySelector('[data-action="toggle-2027"]')?.addEventListener("click", toggle2027);
    document.querySelector('[data-action="copy-url"]')?.addEventListener("click", () => { copyCalendarUrl().catch(() => {}); });
    document.querySelector('[data-action="refresh"]')?.addEventListener("click", () => { hardRefresh().catch(() => window.location.reload()); });

    if (currentDayEl()) {
      window.addEventListener("load", () => {
        scrollToToday({ behavior: "auto" });
      });
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
