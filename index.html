<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jamie's 2026 Running</title>
  <meta name="theme-color" content="#ffe24d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="2026 Runs" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f2ea;
      --paper: #fffdf8;
      --ink: #17202a;
      --muted: #7b7468;
      --line: #ded6c8;
      --weekend: #f1e8da;
      --today: #f9d65c;
      --pencil: #16120d;
      --highlighter: rgba(255, 226, 77, 0.62);
      --highlighter-strong: rgba(255, 216, 38, 0.78);
      --pink-highlighter: rgba(255, 147, 190, 0.58);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: var(--ink);
    }
    main { max-width: 1780px; margin: 0 auto; padding: 34px 24px 56px; background: #fff; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(2.5rem, 6vw, 6rem); line-height: 0.9; letter-spacing: -0.07em; }
    .sub { color: var(--muted); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.82rem; }
    .year-grid { display: grid; grid-template-columns: repeat(3, minmax(360px, 1fr)); column-gap: 26px; row-gap: 46px; }
    .month {
      scroll-margin-top: 18px;
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
      break-inside: avoid;
    }
    .month h2 {
      margin: 0 0 18px;
      text-align: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1.72rem;
      line-height: 0.95;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      color: var(--ink);
      font-weight: 900;
    }
    .days, .dates { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .dow { color: var(--muted); font-size: 0.68rem; font-weight: 900; text-align: center; text-transform: uppercase; padding-bottom: 3px; }
    .day {
      min-height: 76px;
      border-radius: 9px;
      border: 1px solid #eadfce;
      padding: 4px 0;
      position: relative;
      background: rgba(255,255,255,0.55);
      overflow: visible;
    }
    .today { outline: 2px solid var(--today); outline-offset: -2px; }
    .empty { opacity: 0; pointer-events: none; }
    .date-number {
      display: block;
      color: color-mix(in srgb, var(--muted) 72%, white);
      font-size: 0.76rem;
      font-weight: 850;
      line-height: 1;
      margin: 0 4px 4px;
    }
    .event-stack { display: grid; gap: 2px; position: relative; }
    .event-bar, .event-spacer {
      min-height: 17px;
      border-radius: 4px;
      font-size: 1.05rem;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: -0.02em;
    }
    .event-spacer { visibility: hidden; }
    .event-bar {
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-weight: 800;
      padding: 3px 2px;
      position: relative;
      z-index: 3;
      background: linear-gradient(100deg, transparent 0, var(--highlighter-strong) 2% 98%, transparent 100%);
      box-shadow: none;
      transform: rotate(-0.25deg);
    }
    .event-bar.single {
      display: block;
      white-space: normal;
      overflow-wrap: normal;
      min-height: 0;
      padding: 0 2px;
      border-radius: 0;
      line-height: 1.22;
      background: none;
    }
    .event-bar.single .highlight-text {
      background: linear-gradient(transparent 44%, var(--highlighter-strong) 44% 82%, transparent 82%);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      padding: 0 0.05em;
    }
    .event-bar.multi {
      white-space: nowrap;
      overflow: hidden;
      min-height: 0;
      padding: 0 2px;
      line-height: 1.22;
      border-radius: 0;
    }
    .event-bar.multi.upcoming,
    .event-bar.multi.completed,
    .event-bar.multi.trip { background: linear-gradient(transparent 44%, var(--highlighter) 44% 82%, transparent 82%); }
    .event-bar.multi.injury { background: linear-gradient(transparent 44%, var(--pink-highlighter) 44% 82%, transparent 82%); }
    .event-bar.single.upcoming,
    .event-bar.single.completed,
    .event-bar.single.trip,
    .event-bar.single.injury { background: none; }
    .event-bar.single.injury .highlight-text { background: linear-gradient(transparent 44%, var(--pink-highlighter) 44% 82%, transparent 82%); }
    .event-bar.cancelled {
      text-decoration: line-through;
      opacity: 0.74;
    }
    .event-bar.multi.cancelled { background: linear-gradient(transparent 44%, rgba(220, 220, 120, 0.55) 44% 82%, transparent 82%); }
    .event-bar.single.cancelled { background: none; }
    .event-bar.single.cancelled .highlight-text { background: linear-gradient(transparent 44%, rgba(220, 220, 120, 0.55) 44% 82%, transparent 82%); }
    .event-bar.continuation { opacity: 0.82; }
    .event-bar.end { border-top-right-radius: 7px; border-bottom-right-radius: 8px; }
    .event-bar.start { border-top-left-radius: 8px; border-bottom-left-radius: 6px; }
    .run-distance {
      display: block;
      width: fit-content;
      margin: 3px 2px 0;
      color: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 1.11rem;
      font-weight: 800;
      line-height: 1.16;
      white-space: nowrap;
      background: none;
      padding: 0 0.08em;
      transform: rotate(0.2deg);
    }
    .run-distance .unit {
      color: var(--muted);
      margin-left: 1px;
    }

    .chart-section {
      margin-top: 64px;
      padding-top: 12px;
    }
    .chart-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }
    .chart-header h2 {
      margin: 0;
      font-size: clamp(1.65rem, 3vw, 2.8rem);
      letter-spacing: -0.055em;
      line-height: 0.95;
    }
    .chart-total {
      color: var(--muted);
      font-weight: 850;
      letter-spacing: 0.02em;
    }
    .distance-chart {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .chart-axis,
    .chart-grid {
      stroke: #ded6c8;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    .chart-grid { opacity: 0.68; }
    .chart-line {
      fill: none;
      stroke: #17202a;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .chart-dot { fill: var(--pencil); }
    .chart-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .chart-note {
      fill: var(--pencil);
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 22px;
      font-weight: 800;
    }
    .chart-itbs {
      fill: var(--pink-highlighter);
      opacity: 0.72;
    }


    @media (max-width: 1280px) { .year-grid { grid-template-columns: repeat(2, minmax(340px, 1fr)); } }
    @media (max-width: 760px) {
      main { padding: 24px 12px 34px; }
      header { align-items: start; flex-direction: column; }
      .year-grid { grid-template-columns: 1fr; }
      .day { min-height: 66px; }
      .event-bar { font-size: 1.03rem; }
    }
    @media print {
      body { background: white; }
      main { max-width: none; padding: 0; }
      header { margin-bottom: 8px; }
      .year-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .month { box-shadow: none; border-radius: 8px; padding: 8px; }
      .day { min-height: 52px; padding: 3px; }
      .event-bar { font-size: 0.95rem; min-height: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Jamie's 2026 Running</h1>
      </div>
    </header>
    <section id="calendar" class="year-grid" aria-label="2026 calendar"></section>
    <section class="chart-section" aria-labelledby="distance-chart-title">
      <div class="chart-header">
        <h2 id="distance-chart-title">Cumulative running distance</h2>
        <div id="chart-total" class="chart-total"></div>
      </div>
      <svg id="distance-chart" class="distance-chart" viewBox="0 0 1500 420" role="img" aria-label="Cumulative running distance through 2026 with ITBS period shaded pink"></svg>
    </section>
  </main>
  <script>
    const year = 2026;
    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const dows = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const today = new Date();
    const isCurrentYear = today.getFullYear() === year;
    const calendar = document.getElementById("calendar");
    const runDistances = {
          "2026-01-11": 10,
          "2026-01-14": 2,
          "2026-01-16": 10,
          "2026-01-18": 10,
          "2026-01-25": 24,
          "2026-01-28": 3,
          "2026-01-31": 15,
          "2026-02-02": 2,
          "2026-02-05": 2,
          "2026-02-08": 10,
          "2026-02-10": 4,
          "2026-02-14": 8,
          "2026-02-21": 36,
          "2026-02-28": 2,
          "2026-03-02": 3,
          "2026-03-03": 4,
          "2026-03-04": 4,
          "2026-03-14": 23,
          "2026-03-28": 6,
          "2026-04-01": 2,
          "2026-04-02": 2,
          "2026-04-05": 20,
          "2026-04-13": 1,
          "2026-04-14": 1,
          "2026-04-18": 3,
          "2026-04-25": 4,
          "2026-04-28": 5,
          "2026-05-05": 2,
          "2026-05-07": 3,
          "2026-05-16": 13,
          "2026-05-18": 4,
          "2026-05-20": 10,
          "2026-05-23": 14,
          "2026-05-25": 2,
          "2026-05-27": 18,
          "2026-05-30": 8,
          "2026-06-03": 2,
          "2026-06-06": 24,
          "2026-06-11": 7,
          "2026-06-13": 8,
          "2026-06-15": 17,
          "2026-06-18": 11,
          "2026-06-19": 3,
          "2026-06-27": 5,
          "2026-07-02": 12,
          "2026-07-04": 21,
          "2026-07-07": 10,
          "2026-07-12": 2,
          "2026-07-18": 29,
          "2026-07-22": 5,
          "2026-07-26": 13,
          "2026-07-27": 8
    };

    const events = [
      { start: "2026-01-10", end: "2026-01-12", status: "trip", title: "Saudi", listTitle: "Saudi", meta: "10–12 Jan" },
      { start: "2026-01-25", status: "completed", title: "UTMB Cornwall", listTitle: "UTMB Cornwall", meta: "" },
      { start: "2026-01-30", end: "2026-02-01", status: "trip", title: "Elche", listTitle: "Elche", meta: "30 Jan–1 Feb" },
      { start: "2026-02-21", status: "trip", title: "Box Hill", listTitle: "Box Hill", meta: "" },
      { start: "2026-02-22", end: "2026-05-10", status: "injury", title: "ITBS", listTitle: "ITBS", meta: "22 Feb–10 May" },
      { start: "2026-03-09", end: "2026-03-13", status: "trip", title: "MTV", listTitle: "MTV", meta: "9–13 Mar" },
      { start: "2026-03-14", status: "completed", title: "Maverick Hampshire", listTitle: "Maverick Hampshire Trail", meta: "24km" },
      { start: "2026-03-17", status: "trip", title: "Meningitis", listTitle: "Meningitis", meta: "" },
      { start: "2026-04-03", end: "2026-04-05", status: "trip", title: "Wales", listTitle: "Wales", meta: "3–5 Apr" },
      { start: "2026-05-01", end: "2026-05-03", status: "cancelled", title: "Oh Meu Deus", listTitle: "UTMB Oh Meu Deus", meta: "22km · Portugal" },
      { start: "2026-05-15", end: "2026-05-17", status: "cancelled", title: "UTMB Eryri", listTitle: "UTMB Eryri", meta: "25km" },
      { start: "2026-05-16", status: "trip", title: "Ivinghoe", listTitle: "Ivinghoe", meta: "" },
      { start: "2026-05-22", end: "2026-05-30", status: "trip", title: "Scotland", listTitle: "Scotland", meta: "22–30 May" },
      { start: "2026-06-05", end: "2026-06-07", status: "trip", title: "Pyrenees", listTitle: "Pyrenees", meta: "5–7 Jun" },
      { start: "2026-06-06", status: "completed", title: "Lourdes Trail", listTitle: "Lourdes Trail Run", meta: "25.6km" },
      { start: "2026-06-13", end: "2026-06-20", status: "trip", title: "Mallorca", listTitle: "Mallorca", meta: "13–20 Jun" },
      { start: "2026-06-29", end: "2026-07-10", status: "trip", title: "Chamonix", listTitle: "Chamonix", meta: "29 Jun–10 Jul" },
      { start: "2026-07-17", end: "2026-07-19", status: "trip", title: "Lakes", listTitle: "Lakes", meta: "17–19 Jul" },
      { start: "2026-07-18", status: "completed", title: "St Sunday", listTitle: "St Sunday Crag Skyrace", meta: "29km / +2,050m · 4:39:40 · 16th overall · 2nd M40-44 🥈" },
      { start: "2026-07-22", end: "2026-07-28", status: "trip", title: "Picos de Europa", listTitle: "Picos de Europa vacation", meta: "Wednesday–Tuesday" },
      { start: "2026-08-01", end: "2026-08-14", status: "trip", title: "Gemma away", listTitle: "Gemma away", meta: "1–14 Aug" },
      { start: "2026-08-14", end: "2026-08-16", status: "trip", title: "Wales", listTitle: "Wales", meta: "14–16 Aug" },
      { start: "2026-08-15", status: "upcoming", title: "Copper Skytrail", listTitle: "Copper Skytrail Eryri", meta: "27km / +2,300m · Snowdonia, Wales" },
      { start: "2026-08-17", end: "2026-08-21", status: "trip", title: "Lake District", listTitle: "Lake District", meta: "4 nights" },
      { start: "2026-09-06", status: "trip", title: "Valencia?", listTitle: "Valencia?", meta: "" },
      { start: "2026-09-17", end: "2026-09-21", status: "trip", title: "Slovenia", listTitle: "Slovenia", meta: "4 nights" },
      { start: "2026-09-20", status: "upcoming", title: "Julian Alps UTMB", listTitle: "Julian Alps Trail Run by UTMB", meta: "20km / +800m · Slovenia" },
      { start: "2026-10-17", status: "upcoming", title: "Jurassic Coast", listTitle: "Jurassic Coast Ultra by UTMB", meta: "54km / +1,500m · Dorset · with Cali" },
      { start: "2026-10-26", end: "2026-11-01", status: "trip", title: "Half Term", listTitle: "Half Term", meta: "7 days" },
      { start: "2026-11-29", status: "trip", title: "Deportivo?", listTitle: "Deportivo?", meta: "" },
      { start: "2026-12-13", status: "trip", title: "Malaga?", listTitle: "Malaga?", meta: "" },
      { start: "2026-12-22", end: "2026-12-23", status: "trip", title: "Bdays", listTitle: "Bdays", meta: "22–23 Dec" },
      { start: "2026-12-25", status: "trip", title: "Xmas", listTitle: "Xmas", meta: "" },
    ];

    function mondayFirstOffset(date) {
      return (date.getDay() + 6) % 7;
    }
    function isoDate(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
    function dateLabel(iso) {
      return new Date(`${iso}T12:00:00`).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    }
    function eventsForDate(iso) {
      return events.filter(event => iso >= event.start && iso <= (event.end || event.start));
    }
    function isStartOfVisibleSegment(event, date) {
      const iso = isoDate(date.getFullYear(), date.getMonth(), date.getDate());
      return iso === event.start || date.getDay() === 1 || date.getDate() === 1;
    }
    function daysBetween(startIso, endIso) {
      const start = new Date(`${startIso}T12:00:00`);
      const end = new Date(`${endIso}T12:00:00`);
      return Math.round((end - start) / 86400000) + 1;
    }
    function visibleSegmentSpan(event, date, daysInMonth) {
      const iso = isoDate(date.getFullYear(), date.getMonth(), date.getDate());
      const end = event.end || event.start;
      const daysLeftInWeek = 7 - ((date.getDay() + 6) % 7);
      const daysLeftInMonth = daysInMonth - date.getDate() + 1;
      const daysLeftInEvent = daysBetween(iso, end);
      return Math.max(1, Math.min(daysLeftInWeek, daysLeftInMonth, daysLeftInEvent));
    }

    function renderDistanceChart() {
      const svg = document.getElementById("distance-chart");
      const totalEl = document.getElementById("chart-total");
      if (!svg || !totalEl) return;

      const width = 1500;
      const height = 420;
      const margin = { top: 28, right: 34, bottom: 54, left: 62 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const yearStart = new Date(`${year}-01-01T12:00:00`);
      const yearEnd = new Date(`${year}-12-31T12:00:00`);
      const totalDays = Math.round((yearEnd - yearStart) / 86400000);
      const entries = Object.entries(runDistances)
        .sort(([a], [b]) => a.localeCompare(b))
        .map(([iso, km]) => ({ iso, date: new Date(`${iso}T12:00:00`), km }));
      if (!entries.length) return;

      let cumulative = 0;
      const points = [{ iso: `${year}-01-01`, date: yearStart, km: 0, cumulative: 0 }];
      for (const entry of entries) {
        cumulative += Number(entry.km || 0);
        points.push({ ...entry, cumulative });
      }
      const total = Math.round(cumulative);
      totalEl.textContent = `${total.toLocaleString("en-GB")} km logged so far`;

      const yMax = Math.max(50, Math.ceil(total / 50) * 50);
      const x = date => margin.left + ((date - yearStart) / 86400000 / totalDays) * plotW;
      const y = value => margin.top + plotH - (value / yMax) * plotH;
      const path = points.map((point, i) => `${i ? "L" : "M"}${x(point.date).toFixed(1)},${y(point.cumulative).toFixed(1)}`).join(" ");
      const monthTicks = Array.from({ length: 12 }, (_, m) => new Date(year, m, 1, 12));
      const yTicks = Array.from({ length: 5 }, (_, i) => Math.round((yMax / 4) * i));
      const itbsStart = new Date(`${year}-02-22T12:00:00`);
      const itbsEnd = new Date(`${year}-05-10T12:00:00`);
      const last = points[points.length - 1];

      svg.innerHTML = `
        <rect class="chart-itbs" x="${x(itbsStart).toFixed(1)}" y="${margin.top}" width="${(x(itbsEnd) - x(itbsStart)).toFixed(1)}" height="${plotH}" rx="9"></rect>
        ${yTicks.map(tick => `<line class="chart-grid" x1="${margin.left}" y1="${y(tick).toFixed(1)}" x2="${width - margin.right}" y2="${y(tick).toFixed(1)}"></line><text class="chart-label" x="${margin.left - 12}" y="${(y(tick) + 4).toFixed(1)}" text-anchor="end">${tick}</text>`).join("")}
        ${monthTicks.map(date => `<line class="chart-grid" x1="${x(date).toFixed(1)}" y1="${margin.top}" x2="${x(date).toFixed(1)}" y2="${height - margin.bottom}" opacity="0.42"></line><text class="chart-label" x="${x(date).toFixed(1)}" y="${height - 21}" text-anchor="middle">${date.toLocaleDateString("en-GB", { month: "short" })}</text>`).join("")}
        <line class="chart-axis" x1="${margin.left}" y1="${height - margin.bottom}" x2="${width - margin.right}" y2="${height - margin.bottom}"></line>
        <line class="chart-axis" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${height - margin.bottom}"></line>
        <text class="chart-note" x="${((x(itbsStart) + x(itbsEnd)) / 2).toFixed(1)}" y="${margin.top + 31}" text-anchor="middle">ITBS</text>
        <path class="chart-line" d="${path}"></path>
        <circle class="chart-dot" cx="${x(last.date).toFixed(1)}" cy="${y(last.cumulative).toFixed(1)}" r="5.5"></circle>
        <text class="chart-note" x="${Math.min(width - margin.right - 8, x(last.date) + 13).toFixed(1)}" y="${(y(last.cumulative) - 10).toFixed(1)}">${total}km</text>
      `;
    }

    for (let month = 0; month < 12; month++) {
      const first = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const offset = mondayFirstOffset(first);
      const el = document.createElement("article");
      el.className = "month";
      el.id = `month-${month + 1}`;
      el.innerHTML = `<h2>${monthNames[month]}</h2>`;

      const days = document.createElement("div");
      days.className = "days";
      for (const dow of dows) {
        const cell = document.createElement("div");
        cell.className = "dow";
        cell.textContent = dow;
        days.appendChild(cell);
      }
      el.appendChild(days);

      const dates = document.createElement("div");
      dates.className = "dates";
      for (let i = 0; i < offset; i++) {
        const blank = document.createElement("div");
        blank.className = "day empty";
        blank.textContent = "·";
        dates.appendChild(blank);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const iso = isoDate(year, month, day);
        const isToday = isCurrentYear && today.getMonth() === month && today.getDate() === day;
        const dayEvents = eventsForDate(iso);
        const runDistance = runDistances[iso];
        const cell = document.createElement("div");
        cell.className = `day${isToday ? " today" : ""}`;
        cell.title = dayEvents.length ? dayEvents.map(event => `${event.listTitle} — ${event.meta}`).join("\n") : iso;
        const stack = dayEvents.map(event => {
          const end = event.end || event.start;
          const startsSegment = isStartOfVisibleSegment(event, date);
          if (!startsSegment) return `<div class="event-spacer">&nbsp;</div>`;
          const span = visibleSegmentSpan(event, date, daysInMonth);
          const isMulti = span > 1 || event.end;
          const startClass = iso === event.start || date.getDay() === 1 || day === 1 ? " start" : "";
          const endClass = iso === end || date.getDay() === 0 || day === daysInMonth ? " end" : "";
          const width = isMulti ? ` style="width: calc(${span * 100}% + ${(span - 1) * 3}px - 4px)"` : "";
          const label = isMulti ? event.title : `<span class="highlight-text">${event.title}</span>`;
          return `<div class="event-bar ${event.status} ${isMulti ? "multi" : "single"}${startClass}${endClass}"${width}>${label}</div>`;
        }).join("");
        const runLabel = runDistance ? `<span class="run-distance">${runDistance}<span class="unit">km</span></span>` : "";
        cell.innerHTML = `<span class="date-number">${day}</span><div class="event-stack">${stack}</div>${runLabel}`;
        dates.appendChild(cell);
      }
      el.appendChild(dates);
      calendar.appendChild(el);
    }

    renderDistanceChart();

    if (isCurrentYear) {
      window.addEventListener("load", () => {
        document.getElementById(`month-${today.getMonth() + 1}`)?.scrollIntoView({ block: "start" });
      });
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
