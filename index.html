<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jamie's 2026 Running</title>
  <meta name="theme-color" content="#ffe24d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="2026 Runs" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f2ea;
      --paper: #fffdf8;
      --ink: #17202a;
      --muted: #7b7468;
      --line: #ded6c8;
      --weekend: #f1e8da;
      --today: #f9d65c;
      --pencil: #16120d;
      --highlighter: rgba(255, 226, 77, 0.62);
      --highlighter-strong: rgba(255, 216, 38, 0.78);
      --run-highlighter: rgba(126, 205, 255, 0.58);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #fff9ea 0, var(--bg) 42rem);
      color: var(--ink);
    }
    main { max-width: 1780px; margin: 0 auto; padding: 34px 24px 44px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(2.5rem, 6vw, 6rem); line-height: 0.9; letter-spacing: -0.07em; }
    .sub { color: var(--muted); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.82rem; }
    .year-grid { display: grid; grid-template-columns: repeat(3, minmax(360px, 1fr)); gap: 18px; }
    .month {
      background: color-mix(in srgb, var(--paper) 94%, white);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 12px 32px rgba(50, 40, 25, 0.07);
      break-inside: avoid;
    }
    .month h2 { margin: 0 0 12px; font-size: 1.3rem; letter-spacing: -0.03em; }
    .days, .dates { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .dow { color: var(--muted); font-size: 0.68rem; font-weight: 900; text-align: center; text-transform: uppercase; padding-bottom: 3px; }
    .day {
      min-height: 76px;
      border-radius: 9px;
      border: 1px solid #eadfce;
      padding: 4px 0;
      position: relative;
      background: rgba(255,255,255,0.55);
      overflow: visible;
    }
    .today { outline: 2px solid var(--today); outline-offset: -2px; }
    .empty { opacity: 0; pointer-events: none; }
    .date-number {
      display: block;
      color: color-mix(in srgb, var(--ink) 75%, white);
      font-size: 0.76rem;
      font-weight: 850;
      line-height: 1;
      margin: 0 4px 4px;
    }
    .event-stack { display: grid; gap: 2px; position: relative; }
    .event-bar, .event-spacer {
      min-height: 17px;
      border-radius: 4px;
      font-size: 0.72rem;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: -0.02em;
    }
    .event-spacer { visibility: hidden; }
    .event-bar {
      color: var(--pencil);
      font-family: "Permanent Marker", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-weight: 800;
      padding: 3px 2px;
      position: relative;
      z-index: 3;
      background: linear-gradient(100deg, transparent 0, var(--highlighter-strong) 2% 98%, transparent 100%);
      box-shadow: none;
      transform: rotate(-0.25deg);
    }
    .event-bar.single {
      display: block;
      white-space: normal;
      overflow-wrap: normal;
      min-height: 0;
      padding: 0 2px;
      border-radius: 0;
      line-height: 1.22;
      background: none;
    }
    .event-bar.single .highlight-text {
      background: linear-gradient(transparent 44%, var(--highlighter-strong) 44% 82%, transparent 82%);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      padding: 0 0.05em;
    }
    .event-bar.multi {
      white-space: nowrap;
      overflow: hidden;
    }
    .event-bar.multi.upcoming,
    .event-bar.multi.completed,
    .event-bar.multi.trip { background: linear-gradient(100deg, transparent 0, var(--highlighter) 2% 98%, transparent 100%); }
    .event-bar.single.upcoming,
    .event-bar.single.completed,
    .event-bar.single.trip { background: none; }
    .event-bar.cancelled {
      text-decoration: line-through;
      opacity: 0.74;
    }
    .event-bar.multi.cancelled { background: linear-gradient(100deg, transparent 0, rgba(220, 220, 120, 0.42) 2% 98%, transparent 100%); }
    .event-bar.single.cancelled { background: none; }
    .event-bar.single.cancelled .highlight-text { background: linear-gradient(transparent 44%, rgba(220, 220, 120, 0.55) 44% 82%, transparent 82%); }
    .event-bar.continuation { opacity: 0.82; }
    .event-bar.end { border-top-right-radius: 7px; border-bottom-right-radius: 8px; }
    .event-bar.start { border-top-left-radius: 8px; border-bottom-left-radius: 6px; }
    .run-distance {
      display: block;
      width: fit-content;
      margin: 3px 2px 0;
      color: var(--pencil);
      font-family: "Permanent Marker", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 0.78rem;
      font-weight: 800;
      line-height: 1.16;
      white-space: nowrap;
      background: linear-gradient(transparent 44%, var(--run-highlighter) 44% 82%, transparent 82%);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      padding: 0 0.08em;
      transform: rotate(0.2deg);
    }
    .run-distance sub {
      font-size: 0.54em;
      vertical-align: sub;
      line-height: 0;
      margin-left: 1px;
    }


    @media (max-width: 1280px) { .year-grid { grid-template-columns: repeat(2, minmax(340px, 1fr)); } }
    @media (max-width: 760px) {
      main { padding: 24px 12px 34px; }
      header { align-items: start; flex-direction: column; }
      .year-grid { grid-template-columns: 1fr; }
      .day { min-height: 66px; }
      .event-bar { font-size: 0.7rem; }
    }
    @media print {
      body { background: white; }
      main { max-width: none; padding: 0; }
      header { margin-bottom: 8px; }
      .year-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .month { box-shadow: none; border-radius: 8px; padding: 8px; }
      .day { min-height: 52px; padding: 3px; }
      .event-bar { font-size: 0.62rem; min-height: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Jamie's 2026 Running</h1>
      </div>
    </header>
    <section id="calendar" class="year-grid" aria-label="2026 calendar"></section>
  </main>
  <script>
    const year = 2026;
    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const dows = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const today = new Date();
    const isCurrentYear = today.getFullYear() === year;
    const calendar = document.getElementById("calendar");
    const runDistances = {
          "2026-02-14": 8,
          "2026-02-21": 36,
          "2026-02-28": 2,
          "2026-03-03": 4,
          "2026-03-14": 23,
          "2026-03-28": 6,
          "2026-04-01": 2,
          "2026-04-05": 20,
          "2026-04-18": 3,
          "2026-04-25": 4,
          "2026-04-28": 5,
          "2026-05-16": 13,
          "2026-05-20": 10,
          "2026-05-23": 14,
          "2026-05-25": 2,
          "2026-05-27": 18,
          "2026-05-30": 8,
          "2026-06-06": 24,
          "2026-06-11": 7,
          "2026-06-13": 8,
          "2026-06-15": 17,
          "2026-06-18": 11,
          "2026-06-27": 5,
          "2026-07-02": 12,
          "2026-07-04": 21,
          "2026-07-07": 10,
          "2026-07-18": 29,
          "2026-07-26": 13,
          "2026-07-27": 8
    };

    const events = [
      { start: "2026-01-25", status: "completed", title: "UTMB Cornwall", listTitle: "UTMB Cornwall", meta: "" },
      { start: "2026-03-14", status: "completed", title: "Maverick Hampshire", listTitle: "Maverick Hampshire Trail", meta: "24km" },
      { start: "2026-05-01", end: "2026-05-03", status: "cancelled", title: "Oh Meu Deus", listTitle: "UTMB Oh Meu Deus", meta: "22km · Portugal" },
      { start: "2026-05-15", end: "2026-05-17", status: "cancelled", title: "UTS Eryri", listTitle: "Ultra-Trail Snowdonia Eryri", meta: "25km" },
      { start: "2026-06-05", end: "2026-06-07", status: "trip", title: "Pyrenees", listTitle: "Pyrenees", meta: "5–7 Jun" },
      { start: "2026-06-06", status: "completed", title: "Lourdes Trail", listTitle: "Lourdes Trail Run", meta: "25.6km" },
      { start: "2026-06-29", end: "2026-07-10", status: "trip", title: "Chamonix", listTitle: "Chamonix", meta: "29 Jun–10 Jul" },
      { start: "2026-07-18", status: "completed", title: "St Sunday", listTitle: "St Sunday Crag Skyrace", meta: "29km / +2,050m · 4:39:40 · 16th overall · 2nd M40-44 🥈" },
      { start: "2026-07-22", end: "2026-07-28", status: "trip", title: "Picos de Europa", listTitle: "Picos de Europa vacation", meta: "Wednesday–Tuesday" },
      { start: "2026-08-15", status: "upcoming", title: "Copper Skytrail", listTitle: "Copper Skytrail Eryri", meta: "27km / +2,300m · Snowdonia, Wales" },
      { start: "2026-08-17", end: "2026-08-21", status: "trip", title: "Lake District", listTitle: "Lake District", meta: "4 nights" },
      { start: "2026-09-17", end: "2026-09-21", status: "trip", title: "Slovenia", listTitle: "Slovenia", meta: "4 nights" },
      { start: "2026-09-20", status: "upcoming", title: "Julian Alps UTMB", listTitle: "Julian Alps Trail Run by UTMB", meta: "20km / +800m · Slovenia" },
      { start: "2026-10-17", status: "upcoming", title: "Jurassic Coast", listTitle: "Jurassic Coast Ultra by UTMB", meta: "54km / +1,500m · Dorset · with Cali" },
    ];

    function mondayFirstOffset(date) {
      return (date.getDay() + 6) % 7;
    }
    function isoDate(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
    function dateLabel(iso) {
      return new Date(`${iso}T12:00:00`).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    }
    function eventsForDate(iso) {
      return events.filter(event => iso >= event.start && iso <= (event.end || event.start));
    }
    function isStartOfVisibleSegment(event, date) {
      const iso = isoDate(date.getFullYear(), date.getMonth(), date.getDate());
      return iso === event.start || date.getDay() === 1 || date.getDate() === 1;
    }
    function daysBetween(startIso, endIso) {
      const start = new Date(`${startIso}T12:00:00`);
      const end = new Date(`${endIso}T12:00:00`);
      return Math.round((end - start) / 86400000) + 1;
    }
    function visibleSegmentSpan(event, date, daysInMonth) {
      const iso = isoDate(date.getFullYear(), date.getMonth(), date.getDate());
      const end = event.end || event.start;
      const daysLeftInWeek = 7 - ((date.getDay() + 6) % 7);
      const daysLeftInMonth = daysInMonth - date.getDate() + 1;
      const daysLeftInEvent = daysBetween(iso, end);
      return Math.max(1, Math.min(daysLeftInWeek, daysLeftInMonth, daysLeftInEvent));
    }

    for (let month = 0; month < 12; month++) {
      const first = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const offset = mondayFirstOffset(first);
      const el = document.createElement("article");
      el.className = "month";
      el.innerHTML = `<h2>${monthNames[month]}</h2>`;

      const days = document.createElement("div");
      days.className = "days";
      for (const dow of dows) {
        const cell = document.createElement("div");
        cell.className = "dow";
        cell.textContent = dow;
        days.appendChild(cell);
      }
      el.appendChild(days);

      const dates = document.createElement("div");
      dates.className = "dates";
      for (let i = 0; i < offset; i++) {
        const blank = document.createElement("div");
        blank.className = "day empty";
        blank.textContent = "·";
        dates.appendChild(blank);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const iso = isoDate(year, month, day);
        const isToday = isCurrentYear && today.getMonth() === month && today.getDate() === day;
        const dayEvents = eventsForDate(iso);
        const runDistance = runDistances[iso];
        const cell = document.createElement("div");
        cell.className = `day${isToday ? " today" : ""}`;
        cell.title = dayEvents.length ? dayEvents.map(event => `${event.listTitle} — ${event.meta}`).join("\n") : iso;
        const stack = dayEvents.map(event => {
          const end = event.end || event.start;
          const startsSegment = isStartOfVisibleSegment(event, date);
          if (!startsSegment) return `<div class="event-spacer">&nbsp;</div>`;
          const span = visibleSegmentSpan(event, date, daysInMonth);
          const isMulti = span > 1 || event.end;
          const startClass = iso === event.start || date.getDay() === 1 || day === 1 ? " start" : "";
          const endClass = iso === end || date.getDay() === 0 || day === daysInMonth ? " end" : "";
          const width = isMulti ? ` style="width: calc(${span * 100}% + ${(span - 1) * 3}px - 4px)"` : "";
          const label = isMulti ? event.title : `<span class="highlight-text">${event.title}</span>`;
          return `<div class="event-bar ${event.status} ${isMulti ? "multi" : "single"}${startClass}${endClass}"${width}>${label}</div>`;
        }).join("");
        const runLabel = runDistance ? `<span class="run-distance">${runDistance}<sub>km</sub></span>` : "";
        cell.innerHTML = `<span class="date-number">${day}</span><div class="event-stack">${stack}</div>${runLabel}`;
        dates.appendChild(cell);
      }
      el.appendChild(dates);
      calendar.appendChild(el);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
