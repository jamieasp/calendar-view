<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 Calendar View</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f2ea;
      --paper: #fffdf8;
      --ink: #17202a;
      --muted: #7b7468;
      --line: #ded6c8;
      --accent: #1f6f78;
      --weekend: #f1e8da;
      --today: #f9d65c;
      --upcoming: #13746b;
      --completed: #4f66d8;
      --cancelled: #9a6b45;
      --trip: #b5478c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #fff9ea 0, var(--bg) 42rem);
      color: var(--ink);
    }
    main { max-width: 1500px; margin: 0 auto; padding: 36px 28px 48px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(2.4rem, 6vw, 6rem); line-height: 0.9; letter-spacing: -0.07em; }
    .sub { color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.82rem; }
    .year-grid { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 18px; }
    .month {
      background: color-mix(in srgb, var(--paper) 92%, white);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(50, 40, 25, 0.07);
      break-inside: avoid;
    }
    .month h2 { margin: 0 0 12px; font-size: 1.25rem; letter-spacing: -0.03em; display: flex; justify-content: space-between; }
    .month h2 span:last-child { color: var(--accent); font-size: 0.9rem; align-self: center; }
    .days, .dates { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .dow { color: var(--muted); font-size: 0.68rem; font-weight: 800; text-align: center; text-transform: uppercase; padding-bottom: 4px; }
    .day {
      min-height: 42px;
      border-radius: 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 0.86rem;
      font-weight: 650;
      border: 1px solid transparent;
      padding: 3px 2px;
      position: relative;
    }
    .date-number { line-height: 1; }
    .race-dot { width: 7px; height: 7px; border-radius: 999px; display: block; }
    .race-dot.upcoming { background: var(--upcoming); }
    .race-dot.completed { background: var(--completed); }
    .race-dot.cancelled { background: var(--cancelled); opacity: 0.72; }
    .race-dot.trip { background: var(--trip); }
    .race-day.upcoming { background: color-mix(in srgb, var(--upcoming) 14%, white); border-color: color-mix(in srgb, var(--upcoming) 45%, white); color: #073b36; }
    .race-day.completed { background: color-mix(in srgb, var(--completed) 13%, white); border-color: color-mix(in srgb, var(--completed) 40%, white); color: #17266e; }
    .race-day.cancelled { background: color-mix(in srgb, var(--cancelled) 13%, white); border-color: color-mix(in srgb, var(--cancelled) 38%, white); color: #56371f; text-decoration: line-through; }
    .trip-day { background: color-mix(in srgb, var(--trip) 12%, white); border-color: color-mix(in srgb, var(--trip) 36%, white); color: #5d1745; }
    .legend, .race-summary { background: color-mix(in srgb, var(--paper) 92%, white); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 32px rgba(50, 40, 25, 0.06); }
    .legend { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; padding: 12px 16px; margin-bottom: 18px; color: var(--muted); font-size: 0.9rem; font-weight: 650; }
    .legend-item { display: inline-flex; gap: 7px; align-items: center; }
    .race-summary { margin-top: 20px; padding: 16px; }
    .race-summary h2 { margin: 0 0 10px; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .race-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .race-card { border-left: 4px solid var(--line); padding: 8px 10px; background: rgba(255,255,255,0.45); border-radius: 10px; }
    .race-card.upcoming { border-color: var(--upcoming); }
    .race-card.completed { border-color: var(--completed); }
    .race-card.cancelled { border-color: var(--cancelled); opacity: 0.78; }
    .race-card.trip { border-color: var(--trip); }
    .race-card strong { display: block; }
    .race-card small { color: var(--muted); }
    .empty { opacity: 0; }
    .weekend { background: var(--weekend); color: #65594a; }
    .today { background: var(--today); border-color: #caa936; color: #251f0d; }
    .ordinal { color: var(--muted); font-variant-numeric: tabular-nums; }
    @media (max-width: 1180px) { .year-grid { grid-template-columns: repeat(3, minmax(230px, 1fr)); } }
    @media (max-width: 860px) { main { padding: 24px 14px 36px; } header { align-items: start; flex-direction: column; } .year-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .month { padding: 12px; border-radius: 14px; } .day { min-height: 34px; font-size: 0.78rem; } .race-list { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .year-grid { grid-template-columns: 1fr; } }
    @media print { body { background: white; } main { max-width: none; padding: 0; } header { margin: 0 0 12px; } .year-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; } .month { box-shadow: none; border-radius: 8px; padding: 8px; } .day { min-height: 22px; font-size: 0.65rem; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="sub">Whole-year race calendar</div>
        <h1>2026</h1>
      </div>
      <div class="sub">Monday-first · bird’s-eye view</div>
    </header>
    <section class="legend" aria-label="Race legend">
      <span class="legend-item"><span class="race-dot upcoming"></span> Upcoming</span>
      <span class="legend-item"><span class="race-dot completed"></span> Completed</span>
      <span class="legend-item"><span class="race-dot cancelled"></span> Cancelled / skipped</span>
      <span class="legend-item"><span class="race-dot trip"></span> Trip / vacation</span>
    </section>
    <section id="calendar" class="year-grid" aria-label="2026 calendar"></section>
    <section class="race-summary" aria-label="Race list">
      <h2>Race year at a glance</h2>
      <div id="race-list" class="race-list"></div>
    </section>
  </main>
  <script>
    const year = 2026;
    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const dows = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const today = new Date();
    const isCurrentYear = today.getFullYear() === year;
    const calendar = document.getElementById("calendar");
    const raceList = document.getElementById("race-list");
    const races = [
      { date: "2026-03-14", status: "completed", title: "Maverick Hampshire Trail", meta: "24km" },
      { date: "2026-05-01", end: "2026-05-03", status: "cancelled", title: "UTMB Oh Meu Deus", meta: "22km · Portugal" },
      { date: "2026-05-15", end: "2026-05-17", status: "cancelled", title: "Ultra-Trail Snowdonia Eryri", meta: "25km" },
      { date: "2026-06-06", status: "completed", title: "Lourdes Trail Run", meta: "25.6km" },
      { date: "2026-07-04", status: "cancelled", title: "Serpent Trail Ultra", meta: "50km" },
      { date: "2026-07-18", status: "completed", title: "St Sunday Crag Skyrace", meta: "29km / +2,050m · 4:39:40 · 16th overall · 2nd M40-44 🥈" },
      { date: "2026-08-15", status: "upcoming", title: "Copper Skytrail Eryri", meta: "27km / +2,300m · Snowdonia, Wales" },
      { date: "2026-09-20", status: "upcoming", title: "Julian Alps Trail Run by UTMB", meta: "20km / +800m · Slovenia" },
      { date: "2026-10-17", status: "upcoming", title: "Jurassic Coast Ultra by UTMB", meta: "54km / +1,500m · Dorset · with Cali" },
    ];
    const raceByDate = new Map(races.map(race => [race.date, race]));
    const trips = [
      { start: "2026-07-22", end: "2026-07-28", title: "Picos de Europa vacation", meta: "Wednesday–Tuesday" },
    ];

    function inTrip(iso) {
      return trips.find(trip => iso >= trip.start && iso <= trip.end);
    }

    function mondayFirstOffset(date) {
      return (date.getDay() + 6) % 7;
    }

    for (let month = 0; month < 12; month++) {
      const first = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const offset = mondayFirstOffset(first);
      const el = document.createElement("article");
      el.className = "month";
      el.innerHTML = `<h2><span>${monthNames[month]}</span><span>${String(month + 1).padStart(2, "0")}</span></h2>`;

      const days = document.createElement("div");
      days.className = "days";
      for (const dow of dows) {
        const cell = document.createElement("div");
        cell.className = "dow";
        cell.textContent = dow;
        days.appendChild(cell);
      }
      el.appendChild(days);

      const dates = document.createElement("div");
      dates.className = "dates";
      for (let i = 0; i < offset; i++) {
        const blank = document.createElement("div");
        blank.className = "day empty";
        blank.textContent = "·";
        dates.appendChild(blank);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const cell = document.createElement("div");
        const weekend = date.getDay() === 0 || date.getDay() === 6;
        const isToday = isCurrentYear && today.getMonth() === month && today.getDate() === day;
        const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const race = raceByDate.get(iso);
        const trip = inTrip(iso);
        cell.className = `day${weekend ? " weekend" : ""}${isToday ? " today" : ""}${trip ? " trip-day" : ""}${race ? ` race-day ${race.status}` : ""}`;
        cell.title = race ? `${race.title} — ${race.meta}` : trip ? `${trip.title} — ${trip.meta}` : iso;
        cell.innerHTML = `<span class="date-number">${day}</span>${race ? `<span class="race-dot ${race.status}" aria-label="${race.status} race"></span>` : trip ? `<span class="race-dot trip" aria-label="trip"></span>` : ""}`;
        dates.appendChild(cell);
      }
      el.appendChild(dates);
      calendar.appendChild(el);
    }

    for (const trip of trips) {
      const card = document.createElement("div");
      card.className = "race-card trip";
      const start = new Date(`${trip.start}T12:00:00`);
      const end = new Date(`${trip.end}T12:00:00`);
      const dateText = `${start.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}–${end.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}`;
      card.innerHTML = `<small>${dateText} · trip</small><strong>${trip.title}</strong><small>${trip.meta}</small>`;
      raceList.appendChild(card);
    }

    for (const race of races) {
      const card = document.createElement("div");
      card.className = `race-card ${race.status}`;
      const date = new Date(`${race.date}T12:00:00`);
      const end = race.end ? new Date(`${race.end}T12:00:00`) : null;
      const dateText = end
        ? `${date.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}–${end.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}`
        : date.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      card.innerHTML = `<small>${dateText} · ${race.status}</small><strong>${race.title}</strong><small>${race.meta}</small>`;
      raceList.appendChild(card);
    }
  </script>
</body>
</html>
